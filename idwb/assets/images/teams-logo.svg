<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Soft glow / shadow -->
  <defs>
    <filter id="teams-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="teams-grad1" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B5FC7"/>
      <stop offset="100%" stop-color="#4F52B2"/>
    </linearGradient>
    <linearGradient id="teams-grad2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B83EB"/>
      <stop offset="100%" stop-color="#5B5FC7"/>
    </linearGradient>
  </defs>

  <!-- Secondary team members avatars in background -->
  <circle cx="68" cy="30" r="14" fill="#7B83EB" opacity="0.85"/>
  <path d="M52 64 C52 52, 84 52, 84 64 Z" fill="#7B83EB" opacity="0.85"/>

  <!-- Main Teams shield / card -->
  <rect x="18" y="22" width="48" height="56" rx="10" fill="url(#teams-grad1)" filter="url(#teams-glow)"/>

  <!-- Letter T badge -->
  <rect x="26" y="32" width="32" height="36" rx="6" fill="#FFFFFF" fill-opacity="0.15"/>
  <path d="M34 40 H50 V45 H44.5 V60 H39.5 V45 H34 Z" fill="#FFFFFF"/>
</svg>
