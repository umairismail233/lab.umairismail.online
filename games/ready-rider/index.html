function TX(k){ var l=state.settings.lang; return (X[l] && X[l][k]) || X.en[k] || T(k); }
function levelName(){
  if(isReady()) return TX("level3");
  if(missionsPassed()===MISSIONS.length) return TX("level2");
  if(missionsPassed()>0) return TX("level1");
  return TX("level0");
}
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function missionById(id){ for(var i=0;i<MISSIONS.length;i++) if(MISSIONS[i].id===id) return MISSIONS[i]; return null; }
function areaById(id){ for(var i=0;i<AREAS.length;i++) if(AREAS[i].id===id) return AREAS[i]; return null; }
function missionIndex(id){ for(var i=0;i<MISSIONS.length;i++) if(MISSIONS[i].id===id) return i; return -1; }
function isUnlocked(mid){
  var i = missionIndex(mid); if(i<=0) return true;
  if(missionById(mid).boss){ return missionsPassed() >= MISSIONS.length-1; }
  return mrec(MISSIONS[i-1].id).passed;
}

/* ================= RUN ENGINE ================= */
var curMission = null, lastResult = null, lastRunLog = null;
var run = null;
var DENOMS = [500,100,50,20,10];
function stepKey(r, s){ return r + ":" + s; }
function newRun(m){
  return { mid:m.id, mission:m, rIdx:0, score:100, pen:{}, firstWrong:{}, log:[], missed:[],
           helped:false, helpUsedStep:{}, safetyFail:false, safetySlips:{}, isFirst: mrec(m.id).first===null && !mrec(m.id).played,
           startTs: Date.now(), boss:{delivered:0, cash:0, attempted:0}, local:{}, done:false };
}
function penalize(key, round, labelObj, safety, correctable){
  if(run.pen[key]) return;
  run.pen[key] = true; run.firstWrong[key] = true;
  run.score = Math.max(0, run.score - WRONG_COST);
  /* Safety gate: in sequence and spotting rounds a wrong tap is a slip the
     rider can still correct in the same run, so it is recorded as an open
     slip (keyed to the step) instead of an instant fail. Completing that
     step correctly clears the slip (see logStep). In scenario rounds the
     chosen action stands as taken, so an unsafe pick fails the gate at
     once, as before. */
  if(safety){ if(correctable) run.safetySlips[key] = true; else run.safetyFail = true; }
  if(run.isFirst && round && round.skill){ state.skillErrors[round.skill] = (state.skillErrors[round.skill]||0) + 1; saveState(); }
  updateScoreChip();
}
function logStep(key, labelObj, safety, ftOverride){
  /* The "needed two tries" tag follows the card that was actually tapped
     wrong. Callers that know the tapped target (sequence items, spot cards)
     pass ftOverride from their own per-card wrong set; round based rounds
     (choice, match, cash) fall back to the round key, which is the step
     itself and therefore already the mistapped target. */
  var ft = (ftOverride !== undefined) ? !!ftOverride : !run.firstWrong[key];
  /* Completing a step correctly corrects any open safety slip on that step:
     the points stay lost and the step keeps its "needed two tries" tag, but
     the slip no longer counts as a missed safety step. */
  if(run.safetySlips) delete run.safetySlips[key];
  run.log.push({ label: labelObj, firstTry: ft, safetyMissed: !!safety && !!run.firstWrong[key] });
  if(safety && run.firstWrong[key]) run.missed.push({ label: labelObj, spot:false });
}
function updateScoreChip(){
  var el = document.getElementById("play-score");
  if(el) el.innerHTML = starIcon(true,16) + " " + T("scoreOf") + " " + numHTML(run ? run.score : 100);
}
function updateDots(){
  var m = run.mission, html = "";
  for(var i=0;i<m.rounds.length;i++) html += '<i class="'+(i<run.rIdx?"done":i===run.rIdx?"now":"")+'"></i>';
  document.getElementById("play-dots").innerHTML = html;
}
function updateBossBar(){
  var bar = document.getElementById("boss-bar");
  if(!run.mission.boss){ bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  bar.innerHTML = "<span>"+T("bossParcels")+": <span class='num'>"+run.boss.delivered+"</span></span>" +
    "<span>"+T("bossCash")+": <span class='num'>Rs "+fmt(run.boss.cash)+"</span></span>" +
    "<span>"+TX("bossAtt")+": <span class='num'>"+run.boss.attempted+"</span></span>";
}
function setLine(txt){ var el=document.getElementById("play-line"); el.textContent = txt; if(state.settings.lang==="ur") el.classList.add("urtext"); else el.classList.remove("urtext"); }
function speakCurrent(){ var r = run.mission.rounds[run.rIdx]; var txt = L(r.prompt); if(r.type==="choice"||r.type==="match"){ var parts=[txt]; if(r.type==="choice") r.options.forEach(function(o){ parts.push(L(o.t)); }); speak(parts.join(". ")); } else speak(txt); }

/* ---------- feedback ---------- */
function showFeedback(good, why, btnLabel, onBtn, minus){
  var fb = document.getElementById("feedback");
  fb.className = "feedback show " + (good ? "good" : "bad");
  fb.innerHTML = '<div class="fhead">' + icon(good?"check":"cross") + "<span>" + (good?T("rightPick"):T("wrongPick")) + "</span>" +
    (minus ? '<span class="minus15">'+T("minus15")+"</span>" : "") + "</div>" +
    '<div class="freason"></div>' +
    (btnLabel ? '<button class="fbtn"></button>' : "");
  fb.querySelector(".freason").textContent = why;
  if(btnLabel){ var b = fb.querySelector(".fbtn"); b.textContent = btnLabel; b.onclick = function(){ hideFeedback(); onBtn && onBtn(); }; }
  if(good) speak(T("rightPick") + ". " + why); else speak(T("wrongPick") + ". " + why);
}
function hideFeedback(){ var fb=document.getElementById("feedback"); fb.className="feedback"; fb.innerHTML=""; }
function showInfo(txt){
  var fb = document.getElementById("feedback");
  fb.className = "feedback show good";
  fb.innerHTML = '<div class="fhead">' + icon("help") + "<span>" + T("helpBtn") + '</span></div><div class="freason"></div>';
  fb.querySelector(".freason").textContent = txt;
}

/* ---------- demo (built from THIS mission's own rounds) ---------- */
var demoTimers = [];
function clearDemoTimers(){ demoTimers.forEach(clearInterval); demoTimers = []; }
function missionTypes(m){ var seen={}, out=[]; m.rounds.forEach(function(r){ if(!seen[r.type]){ seen[r.type]=r; out.push(r); } }); return out; }
function needsDemo(m){ return missionTypes(m).some(function(r){ return !state.demoSeen[r.type]; }); }
function openDemo(m){
  curMission = m;
  show("scr-demo");
  document.querySelector("#scr-demo [data-t='demoTitle']").textContent = T("demoTitle");
  document.getElementById("demo-text").textContent = TX("demoFor") + ": " + L(m.name) + ". " + TX("demoUses");
  var anim = document.getElementById("demo-anim"); anim.innerHTML = "";
  clearDemoTimers();
  missionTypes(m).forEach(function(r){
    var wrap = document.createElement("div"); wrap.style.width="100%";
    var cap = document.createElement("p"); cap.className="msub"; cap.textContent = T("demo"+r.type.charAt(0).toUpperCase()+r.type.slice(1));
    wrap.appendChild(cap);
    var row = document.createElement("div"); row.className="demoanim"; row.style.minHeight="70px";
    wrap.appendChild(row); anim.appendChild(wrap);
    buildDemoRow(row, r);
  });
  document.getElementById("btn-demo-go").onclick = function(){ clearDemoTimers(); missionTypes(m).forEach(function(r){ state.demoSeen[r.type]=true; }); saveState(); beginRun(m); };
  speak(L(m.name) + ". " + TX("demoUses"));
}
function buildDemoRow(row, r){
  var chips = [], litOrder = [];
  function chip(txt, isNum){
    var d = document.createElement("div"); d.className="demochip"; d.innerHTML = isNum ? '<span class="num">'+esc(txt)+"</span>" : esc(txt);
    row.appendChild(d); chips.push(d); return d;
  }
  if(r.type==="choice"){ r.options.forEach(function(o){ var c=chip(L(o.t)); if(o.ok) litOrder=[chips.indexOf(c)]; }); }
  else if(r.type==="match"){ r.options.forEach(function(code){ var c=chip(code,true); if(code===r.code) litOrder=[chips.indexOf(c)]; }); }
  else if(r.type==="seq"){ var disp = shuffle(r.items); disp.forEach(function(it){ chip(L(it.t)); }); litOrder = r.items.map(function(it){ return disp.indexOf(it); });
    /* Sequence demos build the order step by step: each item lights in its
       correct turn and keeps a number badge, so the full order stays visible
       before the cycle restarts. */
    var spos = 0;
    var stimer = setInterval(function(){
      if(spos === 0){ chips.forEach(function(c){ c.classList.remove("lit"); var b = c.querySelector(".dbadge"); if(b) b.remove(); }); }
      if(spos < litOrder.length){
        var c = chips[litOrder[spos]];
        c.classList.add("lit");
        var bd = document.createElement("span"); bd.className = "dbadge"; bd.textContent = (spos + 1); c.appendChild(bd);
        spos++;
      } else { spos = 0; }
    }, 1150);
    demoTimers.push(stimer);
    return;
  }
  else if(r.type==="spot"){ r.cards.forEach(function(cd){ var c=chip(cd.t ? (typeof cd.t==="string"?cd.t:L(cd.t)) : "", false); if(cd.bad) litOrder.push(chips.indexOf(c)); }); }
  else if(r.type==="cash"){ var rem=r.target; DENOMS.forEach(function(d){ while(rem>=d){ chip("Rs "+fmt(d), true); litOrder.push(chips.length-1); rem-=d; } }); }
  var pos = 0;
  var timer = setInterval(function(){
    chips.forEach(function(c){ c.classList.remove("lit"); });
    if(litOrder.length){ chips[litOrder[pos % litOrder.length]].classList.add("lit"); pos++; }
  }, 1100);
  demoTimers.push(timer);
}

/* ---------- mission start ---------- */
function openIntro(m){
  curMission = m;
  if(!isUnlocked(m.id)){ renderHome(); show("scr-home"); return; }
  fillIntro(m); show("scr-intro"); speak(L(m.ustad));
}
function fillIntro(m){
  var a = areaById(m.area);
  document.getElementById("intro-kicker").textContent = (m.boss ? T("bossWord") : T("areaWord") + " " + (AREAS.indexOf(a)+1) + ": " + L(a.name)) + " · " + T("missionWord") + " " + (missionIndex(m.id)+1) + " · " + m.rounds.length + " " + T("roundsWord");
  document.getElementById("intro-title").textContent = L(m.name);
  document.getElementById("intro-sub").textContent = L(m.sub);
  document.getElementById("intro-cap").textContent = TX("stepOf") + ": " + L(m.name);
  document.getElementById("intro-line").textContent = L(m.ustad);
  document.getElementById("intro-skills").innerHTML = m.skills.map(function(s){ return '<span class="skillchip">'+L(SKILLS[s])+"</span>"; }).join("");
  var rec = mrec(m.id);
  var rules = "<h3>"+T("provedHead")+"</h3><ul><li>"+esc(L(m.prove))+"</li>";
  if(!state.firstNoteSeen){
    rules += "<li>"+esc(TX("replayNote"))+"</li>";
    state.firstNoteSeen = true; saveState();
  }
  var hasSafety = m.rounds.some(function(r){ return r.safety || (r.items||[]).some(function(it){ return it.safety; }); });
  if(hasSafety) rules += "<li>"+esc(T("safetyGateLine"))+"</li>";
  if(rec.played) rules += "<li>"+TX("bestScoreLine")+": <span class='num'>"+rec.best+"</span> · "+TX("firstScoreLine")+": <span class='num'>"+(rec.first==null?"-":rec.first)+"</span></li>";
  rules += "</ul>";
  document.getElementById("intro-rules").innerHTML = rules;
  var playLabel = m.boss ? T("startBtn") : (rec.played ? T("replayBtn") : T("startColon") + L(m.name));
  document.getElementById("btn-play").innerHTML = icon("play",22) + "<span>"+esc(playLabel)+"</span>";
  refreshPoints();
}
function startMission(m){
  if(needsDemo(m)) openDemo(m); else beginRun(m);
}
function beginRun(m){
  run = newRun(m);
  show("scr-play");
  document.getElementById("play-title").textContent = L(m.name);
  document.getElementById("btn-help").classList.remove("used");
  updateScoreChip(); updateBossBar();
  renderRound();
}
function currentRound(){ return run.mission.rounds[run.rIdx]; }
function renderRound(){
  hideFeedback(); updateDots(); updateBossBar();
  var r = currentRound();
  setLine(L(r.prompt));
  var body = document.getElementById("play-body"); body.innerHTML = "";
  var card = document.createElement("div"); card.className="promptcard";
  var scene = '<div class="scene"><div class="sceneic">'+icon(r.icon||run.mission.icon,46)+"</div></div>";
  var visual = "";
  if(r.visual){ visual = '<div class="demoanim" style="min-height:56px;">' + Array.from({length:r.visual.count}, function(){ return '<span class="demochip" style="padding:8px 10px;">'+icon(r.visual.icon,26)+"</span>"; }).join("") + "</div>"; }
  if(r.type==="match") visual += '<div class="bigcode"><span class="num">'+esc(r.code)+"</span></div>";
  card.innerHTML = scene + visual + '<div class="ptext"></div>';
  card.querySelector(".ptext").textContent = L(r.prompt);
  body.appendChild(card);
  run.local = {};
  if(r.type==="choice") renderChoice(body, r);
  else if(r.type==="match") renderMatch(body, r);
  else if(r.type==="seq") renderSeq(body, r);
  else if(r.type==="spot") renderSpot(body, r);
  else if(r.type==="cash") renderCash(body, r);
  speakCurrent();
}
function roundDone(whyText){
  var r = currentRound();
  if(r.fx){ run.boss.delivered += (r.fx.delivered||0); run.boss.cash += (r.fx.cash||0); run.boss.attempted += (r.fx.attempted||0); }
  updateBossBar();
  var last = run.rIdx >= run.mission.rounds.length - 1;
  showFeedback(true, whyText || "", last ? T("finishBtn") : T("nextBtn"), function(){
    run.rIdx++;
    if(run.rIdx >= run.mission.rounds.length) finishMission(); else renderRound();
  }, false);
}
function markAttemptedFx(){ run.boss.attempted += 1; }

/* ---------- choice and match ---------- */
function renderChoice(body, r){
  var wrap = document.createElement("div"); wrap.className="opts"; body.appendChild(wrap);
  shuffle(r.options).forEach(function(o){
    var b = document.createElement("button"); b.className="opt";
    b.innerHTML = '<span class="oic">'+icon(o.icon||r.icon||"box",27)+"</span><span class='otxt'></span>";
    b.querySelector(".otxt").textContent = L(o.t);
    b.onclick = function(){
      if(b.disabled) return;
      var key = stepKey(run.rIdx, 0);
      if(o.ok){
        b.classList.add("right"); wrap.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
        logStep(key, {en: shortLabel(r), ur: shortLabel(r)}, !!r.safety);
        roundDone(L(o.why));
      } else {
        var wasFirst = !run.pen[key];
        penalize(key, r, o.t, !!r.safety);
        b.classList.add("wrong"); b.disabled = true;
        showFeedback(false, L(o.why), T("tryAgain"), function(){}, wasFirst);
      }
    };
    wrap.appendChild(b);
  });
  run.local.wrap = wrap;
}
function shortLabel(r){
  var p = L(r.prompt); return p.length > 52 ? p.slice(0, 52) + "..." : p;
}
function renderMatch(body, r){
  var wrap = document.createElement("div"); wrap.className="opts"; body.appendChild(wrap);
  shuffle(r.options).forEach(function(code){
    var b = document.createElement("button"); b.className="opt";
    b.innerHTML = '<span class="oic">'+icon("box",27)+'</span><span class="num">'+esc(code)+"</span>";
    b.onclick = function(){
      if(b.disabled) return;
      var key = stepKey(run.rIdx, 0);
      if(code === r.code){
        b.classList.add("right"); wrap.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; });
        logStep(key, {en:"Match " + r.code, ur:"Match " + r.code}, !!r.safety);
        roundDone(L(r.why));
      } else {
        var wasFirst = !run.pen[key];
        penalize(key, r, null, !!r.safety);
        b.classList.add("wrong"); b.disabled = true;
        showFeedback(false, TX("matchWrong"), T("tryAgain"), function(){}, wasFirst);
      }
    };
    wrap.appendChild(b);
  });
  run.local.wrap = wrap;
}

/* ---------- sequence ---------- */
function renderSeq(body, r){
  var grid = document.createElement("div"); grid.className="cardgrid"; body.appendChild(grid);
  var doneBox = document.createElement("div"); doneBox.className="seqdone hidden"; body.appendChild(doneBox);
  run.local.expect = 0;
  run.local.itemWrong = {};
  shuffle(r.items).forEach(function(it){
    var c = document.createElement("button"); c.className="pcard";
    c.innerHTML = '<span class="pic">'+icon(it.icon||"box",29)+'</span><span class="ctxt"></span>';
    c.querySelector(".ctxt").textContent = L(it.t);
    c.onclick = function(){
      if(c.disabled) return;
      var idx = r.items.indexOf(it);
      var key = stepKey(run.rIdx, run.local.expect);
      if(idx === run.local.expect){
        hideFeedback();
        c.classList.add("locked"); c.disabled = true;
        var ord = document.createElement("span"); ord.className="ord"; ord.innerHTML = '<span class="num">'+(idx+1)+"</span>"; c.appendChild(ord);
        logStep(key, it.t, !!it.safety, !run.local.itemWrong[idx]);
        doneBox.classList.remove("hidden");
        var line = document.createElement("div"); line.textContent = (idx+1) + ". " + L(it.t) + " : " + L(it.why);
        doneBox.appendChild(line);
        speak(L(it.why));
        run.local.expect++;
        if(run.local.expect >= r.items.length) roundDone(L(r.items[r.items.length-1].why));
      } else {
        var wasFirst = !run.pen[key];
        run.local.itemWrong[idx] = true;
        penalize(key, r, null, !!r.items[run.local.expect].safety, true);
        c.classList.add("bad"); setTimeout(function(){ c.classList.remove("bad"); }, 450);
        showFeedback(false, TX("seqWrong"), T("tryAgain"), function(){}, wasFirst);
      }
    };
    grid.appendChild(c);
  });
  run.local.grid = grid;
}

/* ---------- spot ---------- */
function renderSpot(body, r){
  var grid = document.createElement("div"); grid.className="cardgrid"; body.appendChild(grid);
  run.local.found = 0;
  run.local.cardWrong = {};
  run.local.need = r.cards.filter(function(c){ return c.bad; }).length;
  shuffle(r.cards).forEach(function(cd){
    var cIdx = r.cards.indexOf(cd);
    var c = document.createElement("button"); c.className="pcard";
    var label = typeof cd.t === "string" ? cd.t : L(cd.t);
    c.innerHTML = '<span class="pic">'+icon(cd.icon||"box",29)+'</span><span class="ctxt"></span>' + (cd.cond ? '<span class="cond '+(cd.bad?"bad":"ok")+'"></span>' : "");
    c.querySelector(".ctxt").textContent = label;
    if(cd.cond) c.querySelector(".cond").textContent = L(cd.cond);
    c.onclick = function(){
      if(c.disabled) return;
      if(cd.bad){
        c.classList.add("found"); c.disabled = true;
        var key = stepKey(run.rIdx, run.local.found);
        logStep(key, (typeof cd.t==="string" ? {en:cd.t, ur:cd.t} : cd.t), !!r.safety, !run.local.cardWrong[cIdx]);
        run.local.found++;
        speak(L(cd.why));
        if(run.local.found >= run.local.need) roundDone(L(cd.why));
        else showFeedback(true, L(cd.why), "", null, false);
      } else {
        var key2 = stepKey(run.rIdx, run.local.found);
        var wasFirst = !run.pen[key2];
        run.local.cardWrong[cIdx] = true;
        penalize(key2, r, null, !!r.safety, true);
        c.classList.add("bad"); setTimeout(function(){ c.classList.remove("bad"); }, 450);
        showFeedback(false, TX("spotWrong"), T("tryAgain"), function(){}, wasFirst);
      }
    };
    grid.appendChild(c);
  });
  run.local.grid = grid;
}

/* ---------- cash ---------- */
function renderCash(body, r){
  var info = document.createElement("div");
  info.innerHTML = '<div class="cashtarget">'+TX("cashTapBank")+'<br><span class="num">Rs '+fmt(r.target)+'</span></div>' +
    '<div class="cashtotal">'+TX("cashYourHand")+': <span class="num" id="cash-sum">Rs 0</span></div>' +
    '<div class="cashhand" id="cash-hand"><span class="empty">'+TX("cashYourHand")+'</span></div>' +
    '<div class="cashbank" id="cash-bank"></div>';
  body.appendChild(info);
  var hand = [];
  run.local.hand = hand;
  function draw(){
    var sum = hand.reduce(function(a,b){ return a+b; }, 0);
    document.getElementById("cash-sum").textContent = "Rs " + fmt(sum);
    var hb = document.getElementById("cash-hand");
    hb.innerHTML = hand.length ? "" : '<span class="empty">'+TX("cashYourHand")+"</span>";
    hand.forEach(function(d, i){
      var b = document.createElement("button"); b.className = "denom note";
      b.innerHTML = '<span class="num">Rs '+fmt(d)+"</span>";
      b.setAttribute("aria-label", "Remove Rs " + fmt(d));
      b.onclick = function(){ hand.splice(i,1); draw(); };
      hb.appendChild(b);
    });
    run.local.sum = sum;
  }
  var bank = info.querySelector("#cash-bank");
  DENOMS.forEach(function(d){
    var b = document.createElement("button"); b.className = "denom note";
    b.innerHTML = '<span class="num">Rs '+fmt(d)+"</span>";
    b.onclick = function(){ hand.push(d); draw(); };
    bank.appendChild(b);
  });
  var chk = document.createElement("button"); chk.className="btn"; chk.textContent = TX("cashCheck");
  chk.onclick = function(){
    var key = stepKey(run.rIdx, 0);
    if(run.local.sum === r.target){
      logStep(key, {en:"Cash Rs " + fmt(r.target), ur:"Cash Rs " + fmt(r.target)}, !!r.safety);
      roundDone(L(r.why));
    } else {
      var wasFirst = !run.pen[key];
      penalize(key, r, null, !!r.safety);
      showFeedback(false, TX("cashWrongPre") + "Rs " + fmt(run.local.sum||0) + TX("cashWrongPost"), T("tryAgain"), function(){}, wasFirst);
    }
  };
  body.appendChild(chk);
  run.local.drawCash = draw;
  draw();
}

/* ---------- help ---------- */
function useHelp(){
  if(!run || run.done) return;
  var r = currentRound();
  run.helped = true;
  document.getElementById("btn-help").classList.add("used");
  var body = document.getElementById("play-body");
  if(r.type==="choice" && run.local.wrap){
    run.local.wrap.querySelectorAll(".opt").forEach(function(b, i){});
    var opts = r.options, idx = 0;
    run.local.wrap.querySelectorAll(".opt").forEach(function(b){
      var txt = b.querySelector(".otxt").textContent;
      opts.forEach(function(o){ if(L(o.t)===txt && o.ok) b.classList.add("hinted"); });
    });
  } else if(r.type==="match" && run.local.wrap){
    run.local.wrap.querySelectorAll(".opt").forEach(function(b){ if(b.textContent.indexOf(r.code)>=0) b.classList.add("hinted"); });
  } else if(r.type==="seq" && run.local.grid){
    var want = L(r.items[run.local.expect].t);
    run.local.grid.querySelectorAll(".pcard").forEach(function(c){ if(!c.disabled && c.querySelector(".ctxt").textContent===want) c.classList.add("hinted"); });
  } else if(r.type==="spot" && run.local.grid){
    var done = false;
    run.local.grid.querySelectorAll(".pcard").forEach(function(c){
      if(done || c.disabled) return;
      var label = c.querySelector(".ctxt").textContent;
      r.cards.forEach(function(cd){ var t = typeof cd.t==="string" ? cd.t : L(cd.t); if(cd.bad && t===label){ c.classList.add("hinted"); done = true; } });
    });
  } else if(r.type==="cash"){
    var rem = r.target, parts = [];
    DENOMS.forEach(function(d){ while(rem>=d){ parts.push("Rs " + fmt(d)); rem -= d; } });
    showInfo(TX("cashHintPre") + parts.join(" + "));
    return;
  }
  showInfo(T("helpUsed"));
}

/* ---------- finish ---------- */
function finishMission(){
  run.done = true;
  var m = run.mission, rec = mrec(m.id);
  var elapsed = Math.round((Date.now() - run.startTs)/1000);
  state.totalSeconds += elapsed;
  /* The gate fails only on a safety slip still open at the end of the run:
     a corrected slip passes, an uncorrected safety miss does not. */
  if(Object.keys(run.safetySlips).length) run.safetyFail = true;
  var passed = run.score >= PASS_SCORE && !run.safetyFail;
  rec.played = true;
  if(run.isFirst){ rec.first = run.score; rec.firstHelped = run.helped; }
  if(run.score >= rec.best){ rec.best = run.score; rec.bestHelped = run.helped; }
  if(passed){ rec.passed = true; rec.safetyOk = true; }
  if(run.helped) state.helpedMissions[m.id] = true;
  saveState();
  lastRunLog = { log: run.log.slice(), missed: run.missed.slice(), isFirst: run.isFirst, helped: run.helped, safetyFail: run.safetyFail, score: run.score, passed: passed, boss: {delivered: run.boss.delivered, cash: run.boss.cash, attempted: run.boss.attempted} };
  lastResult = { mid: m.id };
  showResult(m.id, false);
}
function showResult(mid, keep){
  var m = missionById(mid), rec = mrec(mid);
  show("scr-result");
  document.getElementById("result-title").textContent = L(m.name);
  document.getElementById("result-cap").textContent = T("missionResult") + " · " + levelName();
  var lr = lastRunLog || { log:[], missed:[], score: rec.best, helped: rec.bestHelped, safetyFail:false, passed: rec.passed, isFirst:false, boss:{delivered:0,cash:0,attempted:0} };
  var st = starsFromScore(lr.score);
  document.getElementById("result-stars").innerHTML = [1,2,3].map(function(i){ return starIcon(i<=st, 52, i<=st); }).join("");
  document.getElementById("result-score").textContent = fmt(lr.score);
  document.getElementById("result-max").textContent = T("of100") + " · " + T("totalOf") + ": " + pointsText();
  var ex = "";
  ex += '<div class="resultcard"><h3>'+T("resultFirst")+" / "+T("resultBest")+"</h3><div>" +
    TX("firstScoreLine")+': <span class="num">'+(rec.first==null?"-":fmt(rec.first))+"</span>" +
    (rec.firstHelped ? ' <span class="helpedtag">'+T("helpBtn")+"</span>" : "") +
    " · " + TX("bestScoreLine")+': <span class="num">'+fmt(rec.best)+"</span>" +
    (rec.bestHelped ? ' <span class="helpedtag">'+T("helpBtn")+"</span>" : "") + "</div></div>";
  if(lr.helped) ex += '<div class="resultcard">'+esc(T("resultHelped"))+"</div>";
  if(lr.safetyFail) ex += '<div class="safetyfail">'+esc(T("safetyFail"))+"</div>";
  else ex += '<div class="resultcard" style="background:var(--safe-bg); border-color:var(--safe-edge);">'+esc(T("safetyOk"))+"</div>";
  ex += '<div class="resultcard">'+esc(T("safetyGateLine"))+"</div>";
  if(m.boss){
    ex += '<div class="resultcard"><h3>'+TX("bossAgg")+"</h3><div>" +
      T("bossParcels")+': <span class="num">'+lr.boss.delivered+"</span> · " +
      TX("bossAtt")+': <span class="num">'+lr.boss.attempted+"</span> · " +
      T("bossCash")+': <span class="num">Rs '+fmt(lr.boss.cash)+"</span><br>"+esc(TX("bossCashOk"))+"</div></div>";
  }
  if(lr.log.length){
    ex += '<div class="resultcard"><h3>'+TX("rightList")+"</h3>" + lr.log.map(function(s){
      return "<div>" + icon("check",15) + " " + esc(L(s.label)) + (s.firstTry ? "" : ' <span class="helpedtag">'+TX("twoTries")+"</span>") + "</div>";
    }).join("") + "</div>";
  }
  /* Fold-in rule: the second list holds only what is still wrong. Every step in a
     finished run ended right (corrected steps sit in the Right list as "needed two
     tries"), and a missed safety step is reported once, as the run level safety
     notice above, never again as an item fault. So no second list is rendered. */
  document.getElementById("result-extra").innerHTML = ex;
  document.getElementById("result-proved").textContent = L(m.prove);
  var idx = missionIndex(mid);
  var nextBtn = document.getElementById("btn-next");
  if(m.boss){ nextBtn.innerHTML = "<span>"+T("viewReport")+"</span>"; nextBtn.onclick = function(){ renderReport(); show("scr-report"); }; }
  else if(idx >= MISSIONS.length-1){ nextBtn.innerHTML = "<span>"+T("bossDoneBtn")+"</span>"; nextBtn.onclick = function(){ renderHome(); show("scr-home"); }; }
  else { nextBtn.innerHTML = "<span>"+T("nextMissionBtn")+"</span>"; nextBtn.onclick = function(){ openIntro(MISSIONS[idx+1]); }; }
  document.getElementById("btn-replay").innerHTML = "<span>"+T("replayBtn")+"</span>";
  speak(L(m.name) + ". " + lr.score + ".");
  refreshPoints();
}

/* ================= HOME / PATH ================= */
function currentTarget(){
  for(var i=0;i<MISSIONS.length;i++){ if(isUnlocked(MISSIONS[i].id) && !mrec(MISSIONS[i].id).passed) return MISSIONS[i].id; }
  return null;
}
function starsHTML(n, size){ var h=""; for(var i=1;i<=3;i++) h += starIcon(i<=n, size||16, i<=n); return h; }
function renderHome(){
  var path = document.getElementById("path"); path.innerHTML = "";
  var target = currentTarget();
  AREAS.forEach(function(a, ai){
    var head = document.createElement("div"); head.className="areah";
    var aStars = 0, aMax = a.missions.length*3;
    a.missions.forEach(function(mid){ aStars += starsFromScore(mrec(mid).best); });
    head.innerHTML = '<span class="ano">'+T("areaWord")+" "+(ai+1)+'</span><span class="aname"></span><span class="astars">★ <span class="num">'+aStars+" / "+aMax+"</span></span>";
    head.querySelector(".aname").textContent = L(a.name);
    path.appendChild(head);
    var road = document.createElement("div"); road.className="roadwrap";
    a.missions.forEach(function(mid, mi){
      var m = missionById(mid), rec = mrec(mid), unlocked = isUnlocked(mid);
      var node = document.createElement("div");
      node.className = "node" + ((ai+mi)%2 ? " flip" : "") + (rec.passed ? " done" : "") + (m.boss ? " boss" : "") + (!unlocked ? " locked" : "");
      var status = rec.passed ? T("doneWord") : unlocked ? T("openWord") : T("locked");
      var sub = status + (rec.played ? " · " + TX("bestScoreLine") + ": " + rec.best + " / 100" : "");
      if(m.boss && !unlocked) sub = TX("pathBossLocked");
      node.innerHTML =
        '<div style="flex:0 0 auto; margin:0 auto; position:relative;">' +
          (target===mid ? '<img class="ali-on" src="assets/ali-face.webp" alt="" />' : "") +
          '<button class="nbtn" aria-label="">' + icon(m.icon, 36) + (rec.passed ? '<span class="tick">'+icon("check",15)+"</span>" : "") + "</button>" +
        "</div>" +
        '<div class="ninfo"><div class="nm"></div><div class="ns"></div><div class="nodestars">' + starsHTML(starsFromScore(rec.best)) + "</div>" +
        (rec.bestHelped ? '<span class="helpedtag">'+T("helpBtn")+"</span>" : "") + "</div>";
      node.querySelector(".nm").textContent = L(m.name);
      node.querySelector(".ns").textContent = sub;
      node.querySelector(".nbtn").setAttribute("aria-label", L(m.name));
      node.querySelector(".nbtn").onclick = function(){ if(unlocked) openIntro(m); };
      node.querySelector(".ninfo").onclick = function(){ if(unlocked) openIntro(m); };
      road.appendChild(node);
    });
    path.appendChild(road);
  });
  var hint = document.querySelector("#scr-home .note");
  if(hint) hint.textContent = (missionsPassed()===MISSIONS.length ? TX("pathDone") : TX("pathNext"));
  refreshPoints();
}

/* ================= LEAGUE ================= */
function ordinal(n){
  if(state.settings.lang==="ur") return TX("rankWord") + " " + n;
  return ["1st","2nd","3rd","4th","5th"][n-1] || (n + "th");
}
function renderLeague(){
  var rows = [{ name: TX("youRow"), pts: totalPoints(), you:true }];
  /* Demo teams race around the player's own score, so the table always
     reads as a close race at any point in the game. */
  var tp = totalPoints(), tmax = totalPointsMax();
  var demoPts = [90, 30, -35, -90].map(function(off){ return Math.max(0, Math.min(tmax, tp + off)); });
  (UI[state.settings.lang].leagueTeams || UI.en.leagueTeams).forEach(function(nm, i){ rows.push({ name: nm, pts: demoPts[i], you:false }); });
  rows.sort(function(a,b){ return b.pts - a.pts; });
  var html = '<div class="resultcard"><div style="margin-bottom:6px;"><span class="demolabel">'+T("demoLabel")+"</span></div><div>"+esc(TX("leagueRule"))+"</div></div>";
  html += '<table class="rep"><tr><th>'+TX("rankWord")+'</th><th>'+T("leagueTitle")+'</th><th class="r">'+T("repTotal")+"</th></tr>";
  rows.forEach(function(r, i){
    html += "<tr" + (r.you ? ' style="background:var(--gold-soft); font-weight:900;"' : "") + "><td>" + ordinal(i+1) + "</td><td>" + esc(r.name) + "</td><td class='r'><span class='num'>" + fmt(r.pts) + " / " + fmt(totalPointsMax()) + "</span></td></tr>";
  });
  html += "</table>";
  document.getElementById("league-body").innerHTML = html;
  refreshPoints();
}

/* ================= REPORT ================= */
function reportStatus(){
  if(missionsPassed()===MISSIONS.length) return T("repComplete");
  var any = MISSIONS.some(function(m){ return mrec(m.id).played; });
  return any ? T("repInProgress") : T("repNotStarted");
}
function renderReport(){
  var b = document.getElementById("report-body");
  var d = new Date();
  var dateStr = d.toLocaleDateString(state.settings.lang==="ur" ? "ur-PK" : "en-GB", { day:"numeric", month:"long", year:"numeric" });
  var html = "";
  html += '<div class="resultcard"><h3>'+T("reportTitle")+"</h3>" +
    "<div>"+T("repRider")+": <b>"+esc(state.profile.name || "-")+"</b> · "+T("repHub")+": <b>"+esc(state.profile.hub || "-")+"</b></div>" +
    "<div>"+T("repDate")+': <span class="num">'+esc(dateStr)+"</span></div>" +
    "<div>"+TX("levelHead")+": <b>"+levelName()+"</b> · "+T("repStatus")+": <b>"+reportStatus()+"</b></div>" +
    "<div>"+T("repTotal")+': <span class="num">'+fmt(totalPoints())+" / "+fmt(totalPointsMax())+"</span> · "+T("repStars")+': <span class="num">'+fmt(totalStars())+" / "+fmt(totalStarsMax())+"</span></div>" +
    "<div>"+T("repTime")+': <span class="num">'+fmt(Math.round(state.totalSeconds/60))+"</span> "+T("repMinutes")+"</div></div>";
  /* areas partition */
  html += '<h3 class="secth">'+T("repAreas")+'</h3><table class="rep"><tr><th>'+T("areaWord")+'</th><th class="r">'+T("repTotal")+'</th><th class="r">'+T("repStars")+"</th></tr>";
  var sumStars = 0;
  AREAS.forEach(function(a, ai){
    var pts = 0, sts = 0;
    a.missions.forEach(function(mid){ var rec = mrec(mid); pts += rec.best; sts += starsFromScore(rec.best); });
    sumStars += sts;
    html += "<tr><td>"+(ai+1)+". "+esc(L(a.name))+'</td><td class="r"><span class="num">'+fmt(pts)+" / "+fmt(a.missions.length*100)+'</span></td><td class="r"><span class="num">'+sts+" / "+(a.missions.length*3)+"</span></td></tr>";
  });
  html += "<tr style='font-weight:950;'><td>"+T("repTotal")+'</td><td class="r"><span class="num">'+fmt(totalPoints())+" / "+fmt(totalPointsMax())+'</span></td><td class="r"><span class="num">'+sumStars+" / "+fmt(totalStarsMax())+"</span></td></tr></table>";
  /* first attempts */
  html += '<h3 class="secth">'+T("repFirst")+'</h3><p class="sectsub">'+T("repFirstNote")+"</p>";
  html += '<table class="rep"><tr><th>'+T("repMission")+'</th><th class="r">'+T("repFirstScore")+'</th><th class="r">'+T("repBestScore")+'</th><th class="r">'+T("repPassed")+"</th></tr>";
  MISSIONS.forEach(function(m, i){
    var rec = mrec(m.id);
    html += "<tr><td>"+(i+1)+". "+esc(L(m.name))+(rec.firstHelped ? ' <span class="helpedtag">'+T("helpBtn")+"</span>" : "")+'</td><td class="r"><span class="num">'+(rec.first==null ? "-" : fmt(rec.first))+'</span></td><td class="r"><span class="num">'+fmt(rec.best)+'</span></td><td class="r">'+(rec.passed ? T("repYes") : T("repNo"))+"</td></tr>";
  });
  html += "</table>";
  var avg = firstAttemptAvg();
  html += '<p class="sectsub">'+T("repFirst")+': <span class="num">'+(avg==null ? "-" : fmt(avg)+" / 100")+"</span></p>";
  /* helped */
  var helpedList = MISSIONS.filter(function(m){ return state.helpedMissions[m.id]; });
  html += '<h3 class="secth">'+T("repHelped")+"</h3>";
  html += helpedList.length ? '<div class="resultcard">'+helpedList.map(function(m){ return esc(L(m.name)); }).join("<br>")+"</div>" : '<p class="sectsub">'+T("repHelpedNone")+"</p>";
  /* mistakes by skill */
  var errs = Object.keys(state.skillErrors).filter(function(k){ return state.skillErrors[k] > 0; }).sort(function(a,b){ return state.skillErrors[b]-state.skillErrors[a]; });
  html += '<h3 class="secth">'+T("repMistakes")+"</h3>";
  html += errs.length ? '<table class="rep">'+errs.map(function(k){ return "<tr><td>"+esc(L(SKILLS[k]))+'</td><td class="r"><span class="num">'+state.skillErrors[k]+"</span></td></tr>"; }).join("")+"</table>" : '<p class="sectsub">'+T("repMistakesNone")+"</p>";
  /* pass line */
  var ready = isReady();
  var allPassed = missionsPassed()===MISSIONS.length;
  var safetyAll = MISSIONS.every(function(m){ return !mrec(m.id).passed || mrec(m.id).safetyOk; }) && allPassed;
  function condRow(ok, txt){ return "<li>"+(ok ? "✔ " : "✘ ") + esc(txt) + "</li>"; }
  html += '<div class="passline '+(ready ? "ok" : "no")+'"><div class="pt">'+(ready ? T("passReady") : T("passNotReady"))+" · "+levelName()+"</div><ul>" +
    condRow(allPassed, T("passLine1") + " (" + missionsPassed() + " / " + MISSIONS.length + ")") +
    condRow(safetyAll, T("passLine2")) +
    condRow(avg!=null && avg>=READY_FIRST_AVG, T("passLine3") + " (" + (avg==null ? "-" : avg) + ")") +
    "</ul></div>";
  html += '<p class="sectsub" style="margin-top:12px;">'+T("repStandard")+"</p>";
  html += '<p class="sectsub" style="margin-top:8px;">'+T("safetyGateLine")+"</p>";
  html += '<p class="sectsub" style="margin-top:8px;">'+T("repHonest")+"</p>";
  b.innerHTML = html;
  refreshPoints();
}
function copyReport(){
  var lines = [];
  lines.push("READY RIDER : " + T("reportTitle"));
  lines.push(T("repRider") + ": " + (state.profile.name||"-") + " | " + T("repHub") + ": " + (state.profile.hub||"-"));
  lines.push(T("repTotal") + ": " + totalPoints() + " / " + totalPointsMax() + " | " + T("repStars") + ": " + totalStars() + " / " + totalStarsMax());
  lines.push(TX("levelHead") + ": " + levelName() + " | " + T("repStatus") + ": " + reportStatus());
  MISSIONS.forEach(function(m, i){ var rec = mrec(m.id); lines.push((i+1) + ". " + L(m.name) + " : " + T("repFirstScore") + " " + (rec.first==null?"-":rec.first) + " | " + T("repBestScore") + " " + rec.best + " | " + (rec.passed ? T("repYes") : T("repNo"))); });
  lines.push((isReady() ? T("passReady") : T("passNotReady")));
  var txt = lines.join("\n");
  function done(){ var btn = document.getElementById("btn-copy-report"); var old = btn.textContent; btn.textContent = T("copied"); setTimeout(function(){ btn.textContent = old; }, 1800); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ fallback(); }); } else fallback();
  function fallback(){ var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }
}

/* ================= SETTINGS ================= */
function openSettings(){
  document.getElementById("set-name").value = state.profile.name || "";
  document.getElementById("set-hub").value = state.profile.hub || "";
  updateSpeakers();
  document.getElementById("sheet-settings").classList.add("show");
}
function closeSettings(){ document.getElementById("sheet-settings").classList.remove("show"); }

/* ================= INIT ================= */
function init(){
  loadState();
  /* static icons for back buttons */
  document.querySelectorAll("[data-ic]").forEach(function(el){ el.innerHTML = icon(el.getAttribute("data-ic"), 22); });
  document.querySelectorAll("[data-speaker]").forEach(function(b){ b.onclick = function(){ toggleSound(false); }; });
  document.querySelectorAll("[data-back]").forEach(function(b){ b.onclick = function(){ requestExit(function(){ run = null; clearDemoTimers(); renderHome(); show("scr-home"); }); }; });
  document.getElementById("btn-stay").onclick = function(){ closeLeaveSheet(); };
  document.getElementById("btn-leave").onclick = function(){ var a = pendingExit; closeLeaveSheet(); if(a) a(); };
  document.getElementById("lang-en").onclick = function(){ setLang("en"); };
  document.getElementById("lang-ur").onclick = function(){ setLang("ur"); };
  document.getElementById("set-lang-en").onclick = function(){ setLang("en"); };
  document.getElementById("set-lang-ur").onclick = function(){ setLang("ur"); };
  document.getElementById("btn-start").onclick = function(){
    state.profile.name = document.getElementById("inp-name").value.trim();
    state.profile.hub = document.getElementById("inp-hub").value.trim();
    state.started = true; saveState();
    renderHome(); show("scr-home");
    speak(T("speakStart"));
  };
  document.getElementById("btn-league").onclick = function(){ renderLeague(); show("scr-league"); };
  document.getElementById("btn-settings").onclick = openSettings;
  document.getElementById("btn-report").onclick = function(){ renderReport(); show("scr-report"); };
  document.getElementById("btn-intro-report").onclick = function(){ renderReport(); show("scr-report"); };
  document.getElementById("btn-play").onclick = function(){ if(curMission) startMission(curMission); };
  document.getElementById("btn-replay").onclick = function(){ if(lastResult) startMission(missionById(lastResult.mid)); };
  document.getElementById("btn-result-path").onclick = function(){ renderHome(); show("scr-home"); };
  document.getElementById("btn-copy-report").onclick = copyReport;
  document.getElementById("btn-help").onclick = useHelp;
  document.getElementById("sw-sound").onclick = function(){ toggleSound(true); };
  document.getElementById("btn-save-profile").onclick = function(){
    state.profile.name = document.getElementById("set-name").value.trim();
    state.profile.hub = document.getElementById("set-hub").value.trim();
    saveState(); closeSettings();
  };
  document.getElementById("btn-reset").onclick = function(){
    var rb = document.getElementById("btn-reset");
    if(!rb.dataset.armed){ rb.dataset.armed = "1"; rb.textContent = T("resetSure"); return; }
    var keepSettings = state.settings, keepProfile = state.profile;
    state = defaultState(); state.settings = keepSettings; state.profile = keepProfile;
    saveState(); rb.dataset.armed = ""; rb.textContent = T("resetBtn");
    closeSettings(); applyStatic(); renderHome(); show("scr-home");
  };
  document.getElementById("btn-close-settings").onclick = closeSettings;
  document.getElementById("sheet-settings").addEventListener("click", function(e){ if(e.target === this) closeSettings(); });
  /* prefill + static text */
  document.getElementById("inp-name").value = state.profile.name || "";
  document.getElementById("inp-hub").value = state.profile.hub || "";
  applyStatic();
  if(state.started){ renderHome(); show("scr-home"); } else { show("scr-start"); }
  /* aria labels follow language */
  document.querySelectorAll("[data-speaker]").forEach(function(b){ b.setAttribute("aria-label", T("soundRow")); });
  document.getElementById("btn-league").setAttribute("aria-label", T("leagueTitle"));
  document.getElementById("btn-settings").setAttribute("aria-label", T("settingsTitle"));
}
document.addEventListener("DOMContentLoaded", init);
</script>
