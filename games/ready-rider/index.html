<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Ready Rider</title>
<style>
@font-face{font-family:'Jameel';src:url('assets/jameel.woff2') format('woff2');font-display:swap;}
:root{
  color-scheme:light dark;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F1EAD9; --ink:#1C1917; --muted:#5D564D;
  --green:#14532D; --green2:#166534; --green-edge:#0A3319; --green-soft:#E0EFDC;
  --gold:#C9A227; --gold-edge:#8A6D14; --gold-soft:#F7ECD2;
  --safe:#166534; --safe-bg:#DFF0DC; --safe-edge:#0A3319;
  --danger:#B3261E; --danger-edge:#7E1B15; --danger-bg:#FBE7E4;
  --money:#7A5C00; --money-bg:#F7ECD2;
  --line:#E3D8C2; --shadow:0 8px 22px rgba(28,25,23,.12);
  --road:#D9D0BA; --roadline:#FFFDF4; --nodelock:#B7AF9E; --nodelock-edge:#8F8875;
  --sky1:#CDEBCB; --sky2:#F6ECD0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171410; --surface:#262119; --surface2:#322B20; --ink:#F5EFE3; --muted:#C4B8A4;
    --green:#2E7D46; --green2:#2F8F4E; --green-edge:#14502A; --green-soft:#203626;
    --gold:#D9B23C; --gold-edge:#8F6E14; --gold-soft:#3A3115;
    --safe:#7BD88F; --safe-bg:#1E3325; --safe-edge:#14502A;
    --danger:#FF9A8A; --danger-edge:#7E1B15; --danger-bg:#3E201B;
    --money:#EBCB6B; --money-bg:#3A3115;
    --line:#3E372A; --shadow:0 8px 22px rgba(0,0,0,.5);
    --road:#3B362A; --roadline:#57503E; --nodelock:#5A5344; --nodelock-edge:#3E382C;
    --sky1:#1D2E20; --sky2:#2A2415;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:linear-gradient(180deg, var(--sky1) 0%, var(--bg) 340px); background-color:var(--bg); color:var(--ink); font-size:16px; line-height:1.45; min-height:100dvh;}
body.lang-ur{font-family:'Jameel','Noto Nastaliq Urdu',serif;}
body.lang-ur .keep-latin{font-family:Inter, system-ui, sans-serif;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input{font-family:inherit;}
img{display:block; max-width:100%;}
.phone{max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative; background:var(--bg); box-shadow:0 0 44px rgba(20,40,20,.16);}
.screen{display:none; flex-direction:column; flex:1; padding:0 16px 26px;}
.screen.active{display:flex;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}}

/* HUD */
.hud{display:flex; align-items:center; gap:8px; padding:12px 0 10px;}
.hud .avatar{width:40px; height:40px; flex:0 0 40px;}
.hudprog{flex:1; min-width:0;}
.hudprog .bar{height:14px; background:var(--surface2); border-radius:99px; overflow:hidden; border:1px solid var(--line);}
.hudprog .bar i{display:block; height:100%; background:var(--green2); border-radius:99px; transition:width .5s ease;}
.hudprog .cap{font-size:11px; font-weight:700; color:var(--muted); margin-top:3px; line-height:1.3;}
body.lang-ur .hudprog .cap{font-size:13px; line-height:1.9;}
.pointspill{display:inline-flex; align-items:center; gap:4px; background:var(--gold-soft); border:1.5px solid var(--gold); color:var(--ink); font-weight:900; font-size:12.5px; padding:6px 8px; border-radius:99px; white-space:nowrap; flex:0 0 auto;}
.pointspill svg{width:16px; height:16px; color:var(--gold); flex:0 0 16px;}
.iconbtn{width:44px; height:44px; flex:0 0 44px; border-radius:50%; background:var(--surface); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 var(--line); color:var(--ink);}
.iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.iconbtn svg{width:25px; height:25px;}
.iconbtn.speaker{background:var(--green2); border-color:var(--green-edge); box-shadow:0 3px 0 var(--green-edge); color:#fff;}
.iconbtn.speaker.playing{background:var(--gold); border-color:var(--gold-edge); box-shadow:0 3px 0 var(--gold-edge); color:#241D05; animation:pulseGlow 1.1s ease-in-out infinite;}
.iconbtn.speaker.off{background:var(--surface); border-color:var(--danger); box-shadow:0 3px 0 var(--line); color:var(--danger);}
.iconbtn.leaguebtn{background:var(--gold-soft); border-color:var(--gold); box-shadow:0 3px 0 var(--gold-edge); color:var(--money);}
.iconbtn.backbtn{width:auto; padding:0 14px; gap:6px; border-radius:14px; font-size:15px; font-weight:800; box-shadow:0 4px 0 var(--line); flex:0 0 auto; height:44px;}
.iconbtn.backbtn svg{width:22px; height:22px;}
@keyframes pulseGlow{0%,100%{box-shadow:0 3px 0 var(--gold-edge), 0 0 0 0 rgba(201,162,39,.5);}50%{box-shadow:0 3px 0 var(--gold-edge), 0 0 0 9px rgba(201,162,39,0);}}
.avatar{border-radius:50%; object-fit:contain; object-position:center center; border:3px solid var(--gold); background:#F3EAD3; flex:0 0 auto; padding:6px;}
.num{direction:ltr; unicode-bidi:isolate; font-family:Inter, system-ui, sans-serif; font-weight:800; letter-spacing:.4px;}

/* Urdu text blocks */
.urtext{direction:rtl; text-align:right; font-family:'Jameel','Noto Nastaliq Urdu',serif; line-height:2.05;}
body.lang-ur .ltr-block{direction:ltr; text-align:left;}

/* Guide bubble */
.guide-row{display:flex; align-items:flex-start; gap:12px; margin-top:6px;}
.guide-row .avatar{width:84px; height:84px; padding:9px;}
.bubble{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:10px 14px; box-shadow:var(--shadow); position:relative; flex:1; min-width:0;}
.bubble:before{content:""; position:absolute; left:-9px; top:26px; width:16px; height:16px; background:var(--surface); border-left:1.5px solid var(--line); border-bottom:1.5px solid var(--line); transform:rotate(45deg);}
.bubble .who{font-size:11px; font-weight:900; letter-spacing:.6px; text-transform:uppercase; color:var(--green2); margin-bottom:2px;}
body.lang-ur .bubble .who{letter-spacing:0; font-size:14px;}
.bubble .line{font-size:17px; font-weight:650; line-height:1.5;}
body.lang-ur .bubble .line{font-size:19px; line-height:2.0;}

/* Buttons */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px 18px; border-radius:16px; font-size:17px; font-weight:900; background:var(--green2); color:#fff; border:1.5px solid var(--green-edge); box-shadow:0 5px 0 var(--green-edge); margin-top:14px;}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--green-edge);}
.btn.gold{background:var(--gold); border-color:var(--gold-edge); box-shadow:0 5px 0 var(--gold-edge); color:#241D05;}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line); box-shadow:0 5px 0 var(--line);}
.btn.small{padding:11px 14px; font-size:15px; margin-top:10px;}
.btn svg{width:22px; height:22px;}
.btnrow{display:flex; gap:10px;}
.btnrow .btn{flex:1;}

/* Start screen */
.hero{border-radius:22px; overflow:hidden; border:1.5px solid var(--line); box-shadow:var(--shadow); margin-top:6px; background:var(--surface2);}
.hero img{width:100%; height:auto;}
h1.title{font-size:30px; line-height:1.15; margin:16px 0 4px; font-weight:950; letter-spacing:-.3px;}
body.lang-ur h1.title{font-size:30px; line-height:1.9;}
.tagline{color:var(--muted); font-weight:650; font-size:15.5px; margin:0 0 6px;}
body.lang-ur .tagline{line-height:2;}
.field{margin-top:12px;}
.field label{display:block; font-size:12px; font-weight:900; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:5px;}
body.lang-ur .field label{letter-spacing:0; font-size:15px;}
.field input{width:100%; padding:13px 14px; font-size:16px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink);}
.field input:focus{outline:2px solid var(--green2); outline-offset:1px;}
.langrow{display:flex; gap:10px; margin-top:12px;}
.langchip{flex:1; padding:12px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); font-weight:900; font-size:15px; box-shadow:0 3px 0 var(--line);}
.langchip.on{background:var(--green-soft); border-color:var(--green2); box-shadow:0 3px 0 var(--green-edge); color:var(--green);}
.note{font-size:12.5px; color:var(--muted); text-align:center; margin-top:12px; font-weight:600;}
body.lang-ur .note{font-size:14px; line-height:2;}

/* Path */
.areah{margin:20px 0 4px; display:flex; align-items:baseline; gap:8px;}
.areah .ano{font-size:11px; font-weight:950; letter-spacing:.8px; color:var(--gold-edge); text-transform:uppercase;}
body.lang-ur .areah .ano{letter-spacing:0; font-size:14px;}
.areah .aname{font-size:20px; font-weight:950;}
body.lang-ur .areah .aname{line-height:1.9;}
.areah .astars{margin-inline-start:auto; font-size:12.5px; font-weight:800; color:var(--muted); white-space:nowrap;}
.roadwrap{position:relative; padding:8px 0 2px;}
.roadwrap:before{content:""; position:absolute; top:0; bottom:0; left:50%; width:34px; transform:translateX(-50%); background:var(--road); border-radius:20px;}
.roadwrap:after{content:""; position:absolute; top:6px; bottom:6px; left:50%; width:0; transform:translateX(-50%); border-left:4px dashed var(--roadline);}
.node{display:flex; align-items:center; gap:12px; position:relative; z-index:1; margin:14px 0; width:100%; text-align:start;}
.node.flip{flex-direction:row-reverse; text-align:end;}
.node .nbtn{width:74px; height:74px; flex:0 0 74px; border-radius:50%; margin:0 auto; position:relative; border:3px solid var(--green-edge); background:var(--green2); color:#fff; box-shadow:0 6px 0 var(--green-edge); display:flex; align-items:center; justify-content:center;}
.node .nbtn svg{width:36px; height:36px;}
.node .nbtn:active{transform:translateY(3px); box-shadow:0 3px 0 var(--green-edge);}
.node.locked .nbtn{background:var(--nodelock); border-color:var(--nodelock-edge); box-shadow:0 6px 0 var(--nodelock-edge); color:#fff;}
.node.done .nbtn{background:var(--gold); border-color:var(--gold-edge); box-shadow:0 6px 0 var(--gold-edge); color:#241D05;}
.node.boss .nbtn{width:86px; height:86px; flex-basis:86px; background:var(--green); }
.node .ali-on{position:absolute; top:-26px; left:50%; transform:translateX(-50%); width:44px; height:44px; z-index:2;}
.node .ninfo{flex:1; min-width:0; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:8px 12px; box-shadow:0 3px 0 var(--line);}
.node .ninfo .nm{font-weight:900; font-size:15.5px; line-height:1.3;}
body.lang-ur .node .ninfo .nm{line-height:1.95; font-size:16.5px;}
.node .ninfo .ns{font-size:12px; color:var(--muted); font-weight:700; margin-top:2px;}
body.lang-ur .node .ninfo .ns{font-size:13.5px; line-height:1.9;}
.nodestars{display:flex; gap:2px; margin-top:3px;}
.nodestars svg{width:16px; height:16px; color:var(--line);}
.nodestars svg.f{color:var(--gold);}
.tick{position:absolute; top:-6px; inset-inline-end:-4px; width:26px; height:26px; border-radius:50%; background:var(--safe); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid #fff; z-index:2;}
.tick svg{width:15px; height:15px;}
.helpedtag{display:inline-block; font-size:10.5px; font-weight:900; background:var(--gold-soft); color:var(--money); border:1px solid var(--gold); border-radius:99px; padding:1px 7px; margin-top:3px;}
body.lang-ur .helpedtag{font-size:12.5px;}

/* Intro */
.kicker{font-size:11.5px; font-weight:950; letter-spacing:.8px; text-transform:uppercase; color:var(--gold-edge); text-align:center; margin-top:14px;}
body.lang-ur .kicker{letter-spacing:0; font-size:15px;}
h2.mtitle{font-size:25px; font-weight:950; text-align:center; margin:4px 0 2px; line-height:1.25;}
body.lang-ur h2.mtitle{line-height:1.9;}
.msub{text-align:center; color:var(--muted); font-weight:650; margin:0 0 4px;}
body.lang-ur .msub{line-height:2;}
.skillchips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px;}
.skillchip{font-size:11.5px; font-weight:900; background:var(--green-soft); color:var(--green); border:1px solid var(--green2); border-radius:99px; padding:3px 10px;}
body.lang-ur .skillchip{font-size:14px;}
.rulecard{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; margin-top:14px; box-shadow:0 3px 0 var(--line);}
.rulecard h3{margin:0 0 6px; font-size:14px; font-weight:950;}
.rulecard ul{margin:0; padding-inline-start:18px; font-size:14px; font-weight:600; color:var(--ink);}
.rulecard li{margin:3px 0;}
body.lang-ur .rulecard ul{line-height:2; font-size:15px;}

/* Play */
.playtop{display:flex; align-items:center; gap:8px; padding:12px 0 4px;}
.playtop .ptitle{flex:1; min-width:0; font-weight:950; font-size:16px; line-height:1.25;}
body.lang-ur .playtop .ptitle{line-height:1.9;}
.rounddots{display:flex; gap:5px; justify-content:center; margin:8px 0 2px; flex-wrap:wrap;}
.rounddots i{width:11px; height:11px; border-radius:50%; background:var(--surface2); border:1.5px solid var(--line);}
.rounddots i.done{background:var(--green2); border-color:var(--green-edge);}
.rounddots i.now{background:var(--gold); border-color:var(--gold-edge); transform:scale(1.25);}
.scorechip{display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1.5px solid var(--line); border-radius:99px; padding:6px 11px; font-weight:900; font-size:13px; box-shadow:0 3px 0 var(--line); white-space:nowrap;}
.scorechip svg{width:16px; height:16px; color:var(--gold);}
.helpbtn{display:inline-flex; align-items:center; gap:6px; background:var(--gold-soft); border:1.5px solid var(--gold); color:var(--money); border-radius:99px; padding:7px 12px; font-weight:900; font-size:13px; box-shadow:0 3px 0 var(--gold-edge);}
.helpbtn svg{width:17px; height:17px;}
.helpbtn.used{opacity:.55;}
.bossbar{background:var(--green); color:#fff; border-radius:14px; padding:9px 13px; margin-top:10px; display:flex; gap:14px; justify-content:space-between; font-weight:900; font-size:13.5px; flex-wrap:wrap;}
.bossbar .num{color:#FFE9A8;}
.promptcard{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:14px; margin-top:12px; box-shadow:var(--shadow);}
.promptcard .scene{display:flex; justify-content:center; margin-bottom:8px;}
.promptcard .scene .sceneic{width:76px; height:76px; border-radius:20px; background:var(--green-soft); color:var(--green); display:flex; align-items:center; justify-content:center;}
.promptcard .scene .sceneic svg{width:46px; height:46px;}
.promptcard .ptext{font-size:18px; font-weight:750; line-height:1.5; text-align:center;}
body.lang-ur .promptcard .ptext{font-size:19px; line-height:2.05;}
.bigcode{text-align:center; margin:8px 0 2px;}
.bigcode .num{font-size:30px; background:var(--surface2); border:1.5px dashed var(--gold-edge); border-radius:12px; padding:4px 16px; display:inline-block;}

/* options */
.opts{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
.opt{display:flex; align-items:center; gap:12px; width:100%; text-align:start; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:13px 14px; box-shadow:0 4px 0 var(--line); font-size:16px; font-weight:700; line-height:1.4;}
body.lang-ur .opt{line-height:2; font-size:17px;}
.opt:active{transform:translateY(2px); box-shadow:0 2px 0 var(--line);}
.opt .oic{width:44px; height:44px; flex:0 0 44px; border-radius:12px; background:var(--surface2); color:var(--green); display:flex; align-items:center; justify-content:center;}
.opt .oic svg{width:27px; height:27px;}
.opt.right{background:var(--safe-bg); border-color:var(--safe-edge); box-shadow:0 4px 0 var(--safe-edge);}
.opt.wrong{background:var(--danger-bg); border-color:var(--danger-edge); box-shadow:0 4px 0 var(--danger-edge);}
.opt.hinted{outline:3px solid var(--gold); outline-offset:2px;}
.opt:disabled{opacity:.85; cursor:default;}
.opt .num{font-size:19px;}

/* seq + spot grids */
.cardgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.pcard{position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 10px 12px; box-shadow:0 4px 0 var(--line); text-align:center; font-weight:800; font-size:15px; line-height:1.35; min-height:104px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;}
body.lang-ur .pcard{line-height:1.95; font-size:16px;}
.pcard .pic{width:46px; height:46px; border-radius:13px; background:var(--surface2); color:var(--green); display:flex; align-items:center; justify-content:center;}
.pcard .pic svg{width:29px; height:29px;}
.pcard:active{transform:translateY(2px); box-shadow:0 2px 0 var(--line);}
.pcard.locked{background:var(--safe-bg); border-color:var(--safe-edge); box-shadow:0 4px 0 var(--safe-edge);}
.pcard.bad{background:var(--danger-bg); border-color:var(--danger-edge);}
.pcard.found{background:var(--danger-bg); border-color:var(--danger-edge); box-shadow:0 4px 0 var(--danger-edge);}
.pcard.hinted{outline:3px solid var(--gold); outline-offset:2px;}
.pcard .ord{position:absolute; top:-9px; inset-inline-start:-6px; width:28px; height:28px; border-radius:50%; background:var(--green2); color:#fff; font-weight:950; display:flex; align-items:center; justify-content:center; border:2px solid #fff; font-size:14px;}
.pcard .cond{font-size:11.5px; font-weight:900; padding:2px 8px; border-radius:99px;}
.cond.ok{background:var(--safe-bg); color:var(--safe);}
.cond.bad{background:var(--danger); color:#fff;}
.seqdone{margin-top:12px; background:var(--surface); border:1.5px dashed var(--line); border-radius:14px; padding:10px 12px; font-size:13.5px; font-weight:700;}
.seqdone div{margin:2px 0;}
body.lang-ur .seqdone{line-height:2; font-size:14.5px;}

/* cash */
.cashtarget{text-align:center; margin-top:12px; font-weight:800; font-size:15px;}
.cashtarget .num{font-size:24px; color:var(--money);}
.cashhand{min-height:58px; background:var(--surface); border:1.5px dashed var(--gold-edge); border-radius:14px; margin-top:10px; padding:9px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; justify-content:center;}
.cashhand .empty{color:var(--muted); font-size:13px; font-weight:700;}
.denom{display:inline-flex; align-items:center; justify-content:center; border-radius:10px; font-weight:950; border:1.5px solid; padding:9px 13px; font-size:15px;}
.denom.note{background:#EAF3E2; border-color:var(--green2); color:var(--green);}
.denom.coin{background:var(--gold-soft); border-color:var(--gold-edge); color:var(--money); border-radius:50%; width:52px; height:52px; padding:0;}
.denom:active{transform:scale(.95);}
.cashbank{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:14px;}
.cashtotal{text-align:center; font-weight:950; margin-top:10px; font-size:16px;}
.cashtotal .num{font-size:21px;}

/* feedback sheet */
.feedback{position:sticky; bottom:12px; margin-top:16px; border-radius:18px; padding:14px; border:1.5px solid; box-shadow:var(--shadow); display:none; z-index:5;}
.feedback.show{display:block;}
.feedback.good{background:var(--safe-bg); border-color:var(--safe-edge);}
.feedback.bad{background:var(--danger-bg); border-color:var(--danger-edge);}
.feedback .fhead{display:flex; align-items:center; gap:9px; font-weight:950; font-size:17px;}
.feedback .fhead svg{width:24px; height:24px; flex:0 0 24px;}
.feedback.good .fhead{color:var(--safe);}
.feedback.bad .fhead{color:var(--danger);}
.feedback .freason{margin-top:5px; font-size:15px; font-weight:650; line-height:1.5;}
body.lang-ur .feedback .freason{line-height:2;}
.feedback .fbtn{margin-top:10px; width:100%; padding:12px; border-radius:13px; font-weight:950; font-size:15.5px; background:var(--green2); color:#fff; border:1.5px solid var(--green-edge); box-shadow:0 4px 0 var(--green-edge);}
.feedback.bad .fbtn{background:var(--surface); color:var(--danger); border-color:var(--danger-edge); box-shadow:0 4px 0 var(--danger-edge);}
.minus15{margin-inline-start:auto; font-size:12px; font-weight:950; background:var(--danger); color:#fff; border-radius:99px; padding:2px 9px;}
body.lang-ur .minus15{font-size:13px;}

/* result */
.starsbig{display:flex; gap:8px; justify-content:center; margin:10px 0 2px;}
.starsbig svg{width:52px; height:52px; color:var(--line);}
.starsbig svg.f{color:var(--gold); animation:pop .45s ease both;}
.starsbig svg.f:nth-child(2){animation-delay:.12s;} .starsbig svg.f:nth-child(3){animation-delay:.24s;}
@keyframes pop{0%{transform:scale(.4);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
.scorebig{text-align:center; font-size:44px; font-weight:950; line-height:1.1;}
.scorebig .num{font-size:44px;}
.scoremax{text-align:center; color:var(--muted); font-weight:800; font-size:13.5px;}
.resultcard{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:13px 15px; margin-top:13px; box-shadow:0 3px 0 var(--line); font-size:14.5px; font-weight:650;}
.resultcard h3{margin:0 0 5px; font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--muted);}
body.lang-ur .resultcard h3{letter-spacing:0; font-size:15px;}
body.lang-ur .resultcard{line-height:2;}
.safetyfail{background:var(--danger-bg); border:1.5px solid var(--danger-edge); color:var(--danger); border-radius:14px; padding:11px 13px; margin-top:12px; font-weight:800; font-size:14.5px;}
body.lang-ur .safetyfail{line-height:2;}

/* tables / report */
table.rep{width:100%; border-collapse:collapse; margin-top:8px; font-size:14px;}
table.rep th, table.rep td{padding:8px 7px; border-bottom:1px solid var(--line); text-align:start; vertical-align:top;}
table.rep th{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
body.lang-ur table.rep th{letter-spacing:0; font-size:14px;}
body.lang-ur table.rep{line-height:1.95;}
table.rep td.r, table.rep th.r{text-align:end;}
.passline{border-radius:16px; padding:14px; margin-top:14px; border:1.5px solid; font-weight:750;}
.passline.ok{background:var(--safe-bg); border-color:var(--safe-edge);}
.passline.no{background:var(--gold-soft); border-color:var(--gold-edge);}
.passline .pt{font-size:19px; font-weight:950; margin-bottom:5px;}
.passline ul{margin:4px 0 0; padding-inline-start:18px; font-size:14px;}
body.lang-ur .passline{line-height:2;}
.demolabel{display:inline-block; background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-edge); font-size:11px; font-weight:950; padding:2px 9px; border-radius:99px; letter-spacing:.4px;}
body.lang-ur .demolabel{font-size:13px; letter-spacing:0;}
.secth{font-size:19px; font-weight:950; margin:20px 0 2px;}
body.lang-ur .secth{line-height:1.9;}
.sectsub{color:var(--muted); font-size:13px; font-weight:650; margin:0;}
body.lang-ur .sectsub{line-height:1.95; font-size:14px;}

/* settings sheet */
.sheet{position:fixed; inset:0; background:rgba(20,16,8,.45); display:none; z-index:50; align-items:flex-end; justify-content:center;}
.sheet.show{display:flex;}
.sheet .panel{background:var(--bg); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:18px 18px 30px; max-height:88dvh; overflow:auto;}
.sheet .panel h2{margin:2px 0 10px; font-size:21px; font-weight:950;}
.setrow{display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--line); border-radius:15px; padding:13px 14px; margin-top:10px;}
.setrow .sl{flex:1; min-width:0;}
.setrow .sl .t{font-weight:900; font-size:15.5px;}
.setrow .sl .d{font-size:12.5px; color:var(--muted); font-weight:600;}
body.lang-ur .setrow .sl .d{line-height:1.95; font-size:13.5px;}
.switch{width:56px; height:32px; flex:0 0 56px; border-radius:99px; background:var(--surface2); border:1.5px solid var(--line); position:relative;}
.switch i{position:absolute; top:2px; inset-inline-start:3px; width:24px; height:24px; border-radius:50%; background:#fff; border:1.5px solid var(--line); transition:transform .2s;}
.switch.on{background:var(--green2); border-color:var(--green-edge);}
.switch.on i{transform:translateX(23px);}
/* demo */
.demoanim{display:flex; gap:10px; justify-content:center; align-items:center; min-height:120px; margin-top:8px; flex-wrap:wrap;}
.demochip{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:14px 18px; font-weight:950; font-size:16px; box-shadow:0 4px 0 var(--line); position:relative;}
.demochip.lit{outline:3px solid var(--gold); background:var(--safe-bg); border-color:var(--safe-edge);}
.demochip .dbadge{position:absolute; top:-9px; inset-inline-start:-6px; width:26px; height:26px; border-radius:50%; background:var(--green2); color:#fff; font-weight:950; display:flex; align-items:center; justify-content:center; border:2px solid #fff; font-size:13px; font-family:Inter, system-ui, sans-serif;}
.center{text-align:center;}
.mt8{margin-top:8px;} .mt16{margin-top:16px;}
.hidden{display:none !important;}

<body>
<div class="phone" id="phone">

  <!-- START -->

<script>
/* =====================================================================
   READY RIDER: POINTS MODEL (one model, every screen reads it)
   - 15 missions. Each mission is worth 100 points. Game maximum: 1500.
   - A run starts at 100. The first wrong tap on any step costs 15
     points (later wrong taps on the same step cost 0). Floor is 0.
   - Stars per mission: 90 or more = 3, 70 to 89 = 2, 45 to 69 = 1,
     below 45 = 0. Game maximum: 45 stars.
   - Report areas partition the missions with no overlap, so the area
     stars always add up to the rider total stars.
   - A mission counts as PASSED when a run scores 45 or more with no
     safety step left wrong at the end of the run. In sequence and
     spotting rounds a wrong tap corrected in the same run is a slip,
     not a miss: it still costs 15 points and keeps its "needed two
     tries" tag, but the mission passes. A safety step left wrong, or
     an unsafe action chosen in a scenario round, fails the gate.
   - READY (report pass line): all 15 missions passed, the safety gate
     passed on every passing run, and the first attempt average is 70
     or more. First attempt scores are stored once and never change.
   - Using Help marks the run as helped. Helped runs are shown apart
     from first attempt scores in My Report.
   ===================================================================== */

/* ================= UI STRINGS ================= */

/* ================= STATE ================= */
var SKEY = "rr3-state-v1";
var state = null;
function defaultState(){ return {
  profile:{name:"", hub:""},
  settings:{sound:true, lang:"en"},
  missions:{}, skillErrors:{}, demoSeen:{}, helpedMissions:{},
  totalSeconds:0, started:false, firstNoteSeen:false
};}
function loadState(){
  state = defaultState();
  try{ var raw = localStorage.getItem(SKEY); if(raw){ var s = JSON.parse(raw); if(s && typeof s==="object"){ for(var k in s) state[k]=s[k]; if(!state.settings) state.settings={sound:true,lang:"en"}; if(!state.profile) state.profile={name:"",hub:""}; } } }catch(e){}
}
function saveState(){ try{ localStorage.setItem(SKEY, JSON.stringify(state)); }catch(e){} }
function mrec(mid){ if(!state.missions[mid]) state.missions[mid]={best:0, played:false, passed:false, first:null, firstHelped:false, safetyOk:false}; return state.missions[mid]; }

/* ================= SCORES (single source of truth) ================= */
function starsFromScore(s){ return s>=90?3 : s>=70?2 : s>=45?1 : 0; }
function totalPoints(){ var t=0; MISSIONS.forEach(function(m){ t += mrec(m.id).best; }); return t; }
function totalPointsMax(){ return MISSIONS.length * MAX_PER_MISSION; }
function totalStars(){ var t=0; MISSIONS.forEach(function(m){ t += starsFromScore(mrec(m.id).best); }); return t; }
function totalStarsMax(){ return MISSIONS.length * 3; }
function missionsPassed(){ var t=0; MISSIONS.forEach(function(m){ if(mrec(m.id).passed) t++; }); return t; }
function pointsText(){ return fmt(totalPoints()) + " / " + fmt(totalPointsMax()); }
function firstAttemptAvg(){ var sum=0, n=0; MISSIONS.forEach(function(m){ var r=mrec(m.id); if(r.first!=null){ sum+=r.first; n++; } }); return n? Math.round(sum/n) : null; }
function isReady(){ if(missionsPassed()<MISSIONS.length) return false; for(var i=0;i<MISSIONS.length;i++){ if(!mrec(MISSIONS[i].id).safetyOk) return false; } var a=firstAttemptAvg(); return a!=null && a>=READY_FIRST_AVG; }

/* ================= SOUND ================= */
var currentSpeak = "";
/* There is no voice narration in this game. speak() is kept as a no-op so
   older call sites stay harmless; the speaker button is only the master
   Sound on/off switch for the game's sound effects. */
function speak(txt){ currentSpeak = txt || ""; }
function stopSpeak(){ document.querySelectorAll("[data-speaker]").forEach(function(b){ b.classList.remove("playing"); }); }
function updateSpeakers(){
  document.querySelectorAll("[data-speaker]").forEach(function(b){
    b.innerHTML = icon(state.settings.sound ? "speaker" : "speakerOff");
    b.classList.toggle("off", !state.settings.sound);
  });
  var sw = document.getElementById("sw-sound"); if(sw) sw.classList.toggle("on", !!state.settings.sound);
}
function toggleSound(fromSettings){
  state.settings.sound = !state.settings.sound;
  saveState(); updateSpeakers();
  if(!state.settings.sound){ stopSpeak(); }
}
/* ================= NAVIGATION ================= */
var currentScreen = "scr-start";
function show(id){
  currentScreen = id;
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("active", s.id===id); });
  window.scrollTo(0,0);
  refreshPoints();
}
function refreshPoints(){
  var html = starIcon(true,16) + " " + numHTML(totalPoints()) + " / " + fmt(totalPointsMax());
  ["hud-points","intro-points","result-points","league-points","report-points"].forEach(function(id){ var el=document.getElementById(id); if(el) el.innerHTML = html; });
  var bar = document.getElementById("hud-bar"); if(bar) bar.style.width = (totalPointsMax()? (100*totalPoints()/totalPointsMax()) : 0) + "%";
  var cap = document.getElementById("hud-cap"); if(cap) cap.innerHTML = T("scoreOf") + ": " + pointsText() + " · ★ " + fmt(totalStars()) + " / " + fmt(totalStarsMax());
}
function applyStatic(){
  document.body.classList.toggle("lang-ur", state.settings.lang==="ur");
  document.body.style.direction = state.settings.lang==="ur" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = T(el.getAttribute("data-t")); });
  document.querySelectorAll("[data-ic]").forEach(function(el){ el.innerHTML = icon(el.getAttribute("data-ic"),22); });
  document.getElementById("btn-league").innerHTML = icon("trophy");
  document.getElementById("btn-settings").innerHTML = icon("gear");
  document.getElementById("btn-help").innerHTML = icon("help",17) + "<span>"+T("helpBtn")+"</span>";
  document.getElementById("inp-name").placeholder = T("namePh");
  document.getElementById("inp-hub").placeholder = T("hubPh");
  document.getElementById("lang-en").classList.toggle("on", state.settings.lang==="en");
  document.getElementById("lang-ur").classList.toggle("on", state.settings.lang==="ur");
  document.getElementById("set-lang-en").classList.toggle("on", state.settings.lang==="en");
  document.getElementById("set-lang-ur").classList.toggle("on", state.settings.lang==="ur");
  document.getElementById("btn-start").textContent = state.started ? T("continueBtn") : T("startBtn");
  document.getElementById("btn-report").textContent = T("reportBtn");
  document.getElementById("btn-copy-report").textContent = T("copyReport");
  document.getElementById("btn-stay").textContent = T("stayBtn");
  document.getElementById("btn-leave").textContent = T("leaveBtn");
  var rb = document.getElementById("btn-reset"); rb.textContent = T("resetBtn"); rb.dataset.armed="";
  document.querySelectorAll("[data-speaker]").forEach(function(b){ b.setAttribute("aria-label", T("soundRow")); });
  document.getElementById("btn-league").setAttribute("aria-label", T("leagueTitle"));
  document.getElementById("btn-settings").setAttribute("aria-label", T("settingsTitle"));
  updateSpeakers(); refreshPoints();
}
/* Leaving a mission mid run must never wipe progress silently. Back taps
   and language switches during a live run go through requestExit, which
   shows the leave warning first; Stay keeps the run, Leave discards it. */
var pendingExit = null;
function requestExit(action){
  if(run && !run.done && currentScreen==="scr-play"){
    pendingExit = action;
    document.getElementById("sheet-leave").classList.add("show");
    return;
  }
  action();
}
function closeLeaveSheet(){ document.getElementById("sheet-leave").classList.remove("show"); pendingExit = null; }
function setLang(l){
  if(run && !run.done && currentScreen==="scr-play" && l!==state.settings.lang){
    requestExit(function(){ run = null; state.settings.lang = l; saveState(); applyStatic(); renderHome(); show("scr-home"); });
    return;
  }
  state.settings.lang = l; saveState(); applyStatic(); rerender();
}
function rerender(){
  if(currentScreen==="scr-home") renderHome();
  else if(currentScreen==="scr-league") renderLeague();
  else if(currentScreen==="scr-report") renderReport();
  else if(currentScreen==="scr-intro" && curMission) fillIntro(curMission);
  else if(currentScreen==="scr-result" && lastResult) showResult(lastResult.mid, true);
}

 ustad:B("Morning, janab. Before anything else, we match numbers. A wrong parcel on your bike means a wrong door, an angry customer, and a return trip. Read the number on top, then tap the same parcel.","صبح بخیر جناب۔ سب سے پہلے ہم نمبر ملاتے ہیں۔ غلط پارسل بائیک پر ہو تو غلط دروازہ، ناراض کسٹمر، اور واپسی کا چکر لگتا ہے۔ اوپر دیا نمبر پڑھیں، پھر اسی پارسل پر ٹیپ کریں۔"),
 prove:B("You can match a parcel number to the day list, digit by digit, before the parcel goes on the bike.","آپ بائیک پر رکھنے سے پہلے پارسل نمبر کو دن کی فہرست سے ہندسہ بہ ہندسہ ملا سکتے ہیں۔"),
 skills:["scan"],
 rounds:[
  {type:"match", icon:"scan", skill:"scan", code:"PK-4821", options:["PK-4281","PK-4821","PK-8421"], prompt:B("Your list says PK-4821. Tap that parcel.","آپ کی فہرست میں PK-4821 ہے۔ اسی پارسل پر ٹیپ کریں۔"), why:B("Digit by digit: 4, 8, 2, 1. The other two swap digits, which is the most common mix up.","ہندسہ بہ ہندسہ: 4، 8، 2، 1۔ باقی دو میں ہندسے الٹے ہیں، یہی سب سے عام غلطی ہے۔")},
  {type:"match", icon:"scan", skill:"scan", code:"PK-9056", options:["PK-9056","PK-9065","PK-0956"], prompt:B("Next on the list: PK-9056. Tap that parcel.","فہرست میں اگلا: PK-9056۔ اسی پارسل پر ٹیپ کریں۔"), why:B("Same digits, right order. Always read the full number out, never just the first two digits.","وہی ہندسے، درست ترتیب۔ ہمیشہ پورا نمبر پڑھیں، صرف پہلے دو ہندسے نہیں۔")},
  {type:"match", icon:"scan", skill:"scan", code:"PK-3317", options:["PK-3371","PK-3137","PK-3317"], prompt:B("Last one for this shelf: PK-3317.","اس شیلف کا آخری: PK-3317۔"), why:B("The two wrong ones both hide the swap in the middle digits. Slow reading beats a fast guess.","دونوں غلط میں بیچ کے ہندسے بدلے ہیں۔ آہستہ پڑھنا تیز اندازے سے بہتر ہے۔")},
  {type:"choice", icon:"hub", skill:"scan", prompt:B("A parcel on your trolley is not on your list at all. What do you do?","آپ کی ٹرالی پر ایک پارسل ہے جو آپ کی فہرست میں بالکل نہیں۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Load it too. One extra parcel will not hurt, and its stop may be on your way.","اسے بھی لوڈ کر لیں۔ ایک اضافی پارسل سے کچھ نہیں ہوتا، اور اس کا اسٹاپ آپ کے راستے میں ہو سکتا ہے۔"), ok:false, why:B("Wrong pick. A parcel that is not on your list is not yours to carry. Its real rider will be marked short, and if it is lost, the last record points to you.","غلط انتخاب۔ جو پارسل آپ کی فہرست میں نہیں، وہ آپ کے لے جانے کے لیے نہیں۔ اس کے اصل رائیڈر کو کمی پڑے گی، اور یہ گم ہوا تو آخری ریکارڈ آپ کی طرف اشارہ کرے گا۔")},
    {t:B("Scan it and hand it to the hub in-charge.","اسے اسکین کریں اور ہب انچارج کے حوالے کریں۔"), ok:true, why:B("Right pick. Scanning tells the hub where the parcel is, and the in-charge sends it to the right rider.","درست انتخاب۔ اسکین سے ہب کو پتہ چلتا ہے کہ پارسل کہاں ہے، اور انچارج اسے درست رائیڈر کو بھیجتا ہے۔")},
    {t:B("Put it back on any shelf. The hub staff will sort it out.","اسے کسی بھی شیلف پر رکھ دیں۔ ہب کا عملہ خود دیکھ لے گا۔"), ok:false, why:B("Wrong pick. A parcel left anywhere without a scan can sit lost for hours, and the last person seen with it is you.","غلط انتخاب۔ بغیر اسکین کہیں بھی رکھا پارسل گھنٹوں گم رہ سکتا ہے، اور آخری بار وہ آپ کے پاس دیکھا گیا تھا۔")}
   ]}
 ]},
{id:"m2", area:"a1", icon:"eye",
 name:B("Scan and Spot","اسکین کریں اور مسئلہ تلاش کریں"),
 sub:B("One wrong parcel and one damaged parcel are hiding in your load.","آپ کے لوڈ میں ایک غلط پارسل اور ایک خراب پارسل چھپا ہے۔"),
 ustad:B("Scan every parcel as it comes to you. Then look with your eyes: a parcel for another rider, or a parcel that is torn or wet, must never go on your bike. Tap every card that has a problem.","ہر پارسل آتے ہی اسکین کریں۔ پھر آنکھوں سے دیکھیں: دوسرے رائیڈر کا پارسل، یا پھٹا ہوا یا گیلا پارسل، آپ کی بائیک پر کبھی نہ جائے۔ ہر اس کارڈ پر ٹیپ کریں جس میں مسئلہ ہو۔"),
 prove:B("You can scan a load and spot the wrong parcel and the damaged parcel before riding out.","آپ نکلنے سے پہلے لوڈ اسکین کر کے غلط پارسل اور خراب پارسل پہچان سکتے ہیں۔"),
 skills:["scan","parcel"],
 rounds:[
  {type:"spot", icon:"eye", skill:"scan", prompt:B("Your list: PK-101, PK-102, PK-103, PK-104, PK-105. One parcel here is NOT yours. Tap it.","آپ کی فہرست: PK-101، PK-102، PK-103، PK-104، PK-105۔ ان میں ایک پارسل آپ کا نہیں۔ اس پر ٹیپ کریں۔"),
   cards:[
    {t:"PK-101", icon:"box", bad:false},{t:"PK-102", icon:"box", bad:false},
    {t:"PK-210", icon:"box", bad:true, why:B("PK-210 is not on your list. It belongs to another rider. Scan it and hand it to the in-charge.","PK-210 آپ کی فہرست میں نہیں۔ یہ دوسرے رائیڈر کا ہے۔ اسے اسکین کر کے انچارج کے حوالے کریں۔")},
    {t:"PK-103", icon:"box", bad:false},{t:"PK-104", icon:"box", bad:false},{t:"PK-105", icon:"box", bad:false}]},
  {type:"spot", icon:"eye", skill:"parcel", prompt:B("Now check the condition of each parcel. Tap the damaged one.","اب ہر پارسل کی حالت دیکھیں۔ خراب پارسل پر ٹیپ کریں۔"),
   cards:[
    {t:"PK-101", icon:"box", bad:false, cond:B("Good","درست")},{t:"PK-102", icon:"box", bad:false, cond:B("Good","درست")},
    {t:"PK-103", icon:"box", bad:false, cond:B("Good","درست")},
    {t:"PK-104", icon:"box", bad:true, cond:B("Torn and wet","پھٹا اور گیلا"), why:B("Torn and wet means the goods inside may already be spoiled. If you carry it, the damage is blamed on you.","پھٹا اور گیلا مطلب اندر کا سامان خراب ہو سکتا ہے۔ آپ لے گئے تو نقصان آپ کے نام لگے گا۔")},
    {t:"PK-105", icon:"box", bad:false, cond:B("Good","درست")}]},
  {type:"choice", icon:"warn", skill:"parcel", prompt:B("You found a torn and wet parcel. What is the right step?","آپ کو پھٹا اور گیلا پارسل ملا۔ درست قدم کیا ہے؟"),
   options:[
    {t:B("Keep it aside, note it in the app, and tell the in-charge.","اسے الگ رکھیں، ایپ میں درج کریں، اور انچارج کو بتائیں۔"), ok:true, why:B("Right pick. The note in the app proves the damage was there before you touched the parcel.","درست انتخاب۔ ایپ میں اندراج ثابت کرتا ہے کہ نقصان آپ کے چھونے سے پہلے کا تھا۔")},
    {t:B("Tape it up yourself and deliver it.","خود ٹیپ لگا کر پہنچا دیں۔"), ok:false, why:B("Wrong pick. Taping hides the damage. If the customer complains, there is no record that it arrived damaged.","غلط انتخاب۔ ٹیپ نقصان چھپا دیتی ہے۔ کسٹمر شکایت کرے تو کوئی ریکارڈ نہیں ہوگا کہ یہ خراب آیا تھا۔")},
    {t:B("Load it anyway. A wet corner may dry on the way.","ویسے ہی لوڈ کر لیں۔ گیلا کونہ راستے میں خشک ہو جائے گا۔"), ok:false, why:B("Wrong pick. Wet goods spoil more on the road, and when the customer opens it, the damage is blamed on the rider who carried it.","غلط انتخاب۔ گیلا سامان راستے میں مزید خراب ہوتا ہے، اور کسٹمر کھولے تو نقصان اسی رائیڈر کے نام لگتا ہے جو اسے لایا تھا۔")}
   ]}
 ]},
{id:"m3", area:"a1", icon:"bag",
 name:B("Load in a Safe Order","محفوظ ترتیب سے لوڈ کریں"),
 sub:B("Heavy at the bottom, glass kept apart, fragile on top, strap last.","بھاری نیچے، شیشہ الگ، نازک اوپر، پٹا آخر میں۔"),
 ustad:B("Loading is not just fitting things in. Weight, glass, and soft parcels each have a place. Tap the cards in the order you would load them. I will tell you why each one goes there.","لوڈنگ صرف چیزیں ٹھونسنا نہیں۔ وزن، شیشہ، اور نرم پارسل، ہر ایک کی جگہ ہے۔ کارڈز اس ترتیب سے ٹیپ کریں جس سے آپ لوڈ کریں گے۔ میں بتاؤں گا ہر ایک وہاں کیوں جاتا ہے۔"),
 prove:B("You can load a bike bag in a safe order and say why each parcel goes where it goes.","آپ بائیک بیگ محفوظ ترتیب سے لوڈ کر سکتے ہیں اور بتا سکتے ہیں کہ ہر پارسل اپنی جگہ کیوں ہے۔"),
 skills:["parcel"],
 rounds:[
  {type:"seq", icon:"bag", skill:"parcel", prompt:B("Load the bag. Tap the cards in order, first to last.","بیگ لوڈ کریں۔ کارڈز ترتیب سے ٹیپ کریں، پہلے سے آخر تک۔"),
   items:[
    {t:B("Check every parcel against the day list","ہر پارسل دن کی فہرست سے ملائیں"), icon:"scan", why:B("Before any loading: every parcel in front of you must be on your list. Loading a wrong parcel is the mistake this step kills.","لوڈنگ سے پہلے: سامنے کا ہر پارسل آپ کی فہرست میں ہونا چاہیے۔ یہ قدم غلط پارسل لوڈ ہونے کی غلطی ختم کرتا ہے۔")},
    {t:B("Heavy tool box","بھاری اوزاروں کا ڈبہ"), icon:"box", why:B("First into the bag, at the bottom. Heavy weight low down keeps the bike steady and crushes nothing.","بیگ میں پہلے، سب سے نیچے۔ بھاری وزن نیچے ہو تو بائیک سنبھلی رہتی ہے اور کچھ نہیں دبتا۔")},
    {t:B("Two normal parcels","دو عام پارسل"), icon:"box", why:B("Next, in the middle. Normal parcels fill the space and hold each other still.","اس کے بعد، بیچ میں۔ عام پارسل جگہ بھرتے ہیں اور ایک دوسرے کو سنبھالتے ہیں۔")},
    {t:B("Glass parcel, padded and apart","شیشے والا پارسل، لپیٹ کر الگ"), icon:"box", why:B("Next, padded and kept apart from hard parcels. Glass breaks from knocks, not from weight. Some riders put it last; apart and padded is the safe standard, because a top parcel can slide off.","اس کے بعد، لپیٹ کر سخت پارسلز سے الگ۔ شیشہ وزن سے نہیں، ٹکر سے ٹوٹتا ہے۔ کچھ رائیڈر اسے آخر میں رکھتے ہیں؛ الگ اور لپیٹ کر رکھنا محفوظ معیار ہے، کیونکہ اوپر والا پارسل پھسل سکتا ہے۔")},
    {t:B("Soft fragile parcel","نرم نازک پارسل"), icon:"bag", why:B("Next, on top. Nothing presses on it, so it cannot be crushed.","اس کے بعد، سب سے اوپر۔ اس پر کچھ نہیں دبتا، اس لیے یہ کچلا نہیں جا سکتا۔")},
    {t:B("Close the bag and fix the strap","بیگ بند کریں اور پٹا کس کریں"), icon:"strap", why:B("Last, always. A closed bag and a tight strap keep every parcel in its place on the road.","آخر میں، ہمیشہ۔ بند بیگ اور کسا ہوا پٹا سڑک پر ہر پارسل کو اس کی جگہ رکھتا ہے۔")}
   ]}
 ]},
/* ---------- AREA 2: PRE RIDE ---------- */
{id:"m4", area:"a2", icon:"helmet",
 name:B("Pre Ride Check","سفر سے پہلے جانچ"),
 sub:B("Six checks, in an order that puts safety first.","چھ جانچیں، اس ترتیب سے کہ حفاظت پہلے آئے۔"),
 ustad:B("Two minutes here save you on the road. Helmet and brakes come early, before anything else, because they protect your life, not the parcel. Tap the checks in the right order.","یہاں کے دو منٹ سڑک پر آپ کو بچاتے ہیں۔ ہیلمٹ اور بریک سب سے پہلے آتے ہیں، کیونکہ یہ پارسل نہیں، آپ کی جان بچاتے ہیں۔ جانچیں درست ترتیب سے ٹیپ کریں۔"),
 prove:B("You can run a full pre ride check in a safe order and say why safety items come first.","آپ مکمل پری رائیڈ جانچ محفوظ ترتیب سے کر سکتے ہیں اور بتا سکتے ہیں کہ حفاظتی چیزیں پہلے کیوں آتی ہیں۔"),
 skills:["safety"],
 rounds:[
  {type:"seq", icon:"helmet", skill:"safety", prompt:B("Do the pre ride check. Tap the cards in order.","پری رائیڈ جانچ کریں۔ کارڈز ترتیب سے ٹیپ کریں۔"),
   items:[
    {t:B("Helmet on, strap closed","ہیلمٹ پہنیں، پٹا بند کریں"), icon:"helmet", safety:true, why:B("First. The helmet only works if the strap is closed. An open strap lets it fly off in a fall.","پہلے۔ ہیلمٹ تبھی کام کرتا ہے جب پٹا بند ہو۔ کھلا پٹا گرنے پر اسے اڑا دیتا ہے۔")},
    {t:B("Test both brakes","دونوں بریک آزمائیں"), icon:"brake", safety:true, why:B("Second. Squeeze both levers before you move. A dead brake found here costs nothing; found on the road, it costs everything.","دوسرے۔ حرکت سے پہلے دونوں لیور دبائیں۔ یہاں پکڑی گئی خراب بریک مفت ہے؛ سڑک پر پکڑی گئی تو سب کچھ لے جاتی ہے۔")},
    {t:B("Tyres and air","ٹائر اور ہوا"), icon:"tyre", why:B("Third. Low air makes the bike wander and eats fuel. A quick press and look is enough.","تیسرے۔ کم ہوا بائیک کو بھٹکاتی ہے اور پٹرول زیادہ کھاتی ہے۔ دبا کر دیکھنا کافی ہے۔")},
    {t:B("Lights and horn","لائٹس اور ہارن"), icon:"light", why:B("Fourth. Others must see you and hear you, in daylight too.","چوتھے۔ دوسروں کو آپ نظر بھی آئیں اور سنائی بھی دیں، دن میں بھی۔")},
    {t:B("Fuel and phone charge","پٹرول اور فون کی بیٹری"), icon:"fuel", why:B("Fifth. A dead phone means no app, no customer call, no proof of delivery.","پانچویں۔ بند فون کا مطلب ہے نہ ایپ، نہ کسٹمر کال، نہ ڈیلیوری کا ثبوت۔")},
    {t:B("Bag strap and parcel count","بیگ کا پٹا اور پارسل گنتی"), icon:"bag", why:B("Last. Count against the list one final time, then ride.","آخر میں۔ فہرست سے آخری بار گنتی ملائیں، پھر چلیں۔")}
   ]}
 ]},
/* ---------- AREA 3: ROAD ---------- */
{id:"m5", area:"a3", icon:"eye",
 name:B("Road Hazard Spotting","سڑک کے خطرات پہچانیں"),
 sub:B("Slow down early. No parcel is worth a crash.","جلدی رفتار کم کریں۔ کوئی پارسل حادثے کے قابل نہیں۔"),
 ustad:B("In each scene, pick the safest action. Speed is never the answer here. Safety steps are marked: miss one and the run does not pass.","ہر منظر میں محفوظ ترین عمل چنیں۔ یہاں رفتار کبھی جواب نہیں۔ حفاظتی قدم نشان زد ہیں: ایک رہا تو رن پاس نہیں ہوتا۔"),
 prove:B("You can spot common road hazards early and choose the safe action every time.","آپ سڑک کے عام خطرات جلدی پہچان سکتے ہیں اور ہر بار محفوظ عمل چن سکتے ہیں۔"),
 skills:["safety"],
 rounds:[
  {type:"choice", icon:"child", skill:"safety", safety:true, prompt:B("A child runs toward the road chasing a ball. What do you do?","ایک بچہ گیند کے پیچھے سڑک کی طرف بھاگ رہا ہے۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Slow down at once and cover the brake.","فوراً رفتار کم کریں اور بریک پر ہاتھ رکھیں۔"), ok:true, why:B("Right pick. Children change direction without warning. Slow early and you can stop in time.","درست انتخاب۔ بچے بغیر اشارے سمت بدلتے ہیں۔ جلدی رفتار کم کریں تو وقت پر رک سکتے ہیں۔")},
    {t:B("Blow the horn and keep your speed.","ہارن بجائیں اور رفتار رکھیں۔"), ok:false, why:B("Wrong pick. A horn does not stop a child, and at full speed you cannot stop either.","غلط انتخاب۔ ہارن بچے کو نہیں روکتا، اور پوری رفتار پر آپ بھی نہیں رک سکتے۔")},
    {t:B("Swerve around the child and keep your speed.","بچے کے گرد گھوم کر رفتار رکھتے ہوئے نکل جائیں۔"), ok:false, why:B("Wrong pick. A fast swerve on a loaded bike can throw you toward the child or into traffic. Slowing down is the only move that keeps everyone safe.","غلط انتخاب۔ لوڈ شدہ بائیک پر تیز موڑ آپ کو بچے کی طرف یا ٹریفک میں پھینک سکتا ہے۔ رفتار کم کرنا ہی وہ واحد قدم ہے جو سب کو محفوظ رکھتا ہے۔")}
   ]},
  {type:"choice", icon:"bus", skill:"safety", safety:true, prompt:B("A bus ahead is pulling out from its stop without looking. What do you do?","آگے ایک بس بغیر دیکھے اسٹاپ سے نکل رہی ہے۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Squeeze past on the left quickly.","بائیں سے جلدی نکل جائیں۔"), ok:false, why:B("Wrong pick. The gap is closing and the driver has not seen you.","غلط انتخاب۔ جگہ بند ہو رہی ہے اور ڈرائیور نے آپ کو دیکھا ہی نہیں۔")},
    {t:B("Slow down, give space, and let it out.","رفتار کم کریں، جگہ دیں، اور اسے نکلنے دیں۔"), ok:true, why:B("Right pick. Ten seconds lost is nothing. A bus always wins against a bike.","درست انتخاب۔ دس سیکنڈ کا نقصان کچھ نہیں۔ بس ہمیشہ بائیک پر بھاری ہوتی ہے۔")},
    {t:B("Stay close behind the bus and slip out with it.","بس کے بالکل پیچھے رہیں اور اس کے ساتھ ہی نکل جائیں۔"), ok:false, why:B("Wrong pick. Riding in the bus blind spot means the driver pulls out without ever seeing you. Space is what keeps you visible and safe.","غلط انتخاب۔ بس کے اندھے حصے میں رہنے کا مطلب ہے ڈرائیور آپ کو دیکھے بغیر نکلے گا۔ فاصلہ ہی آپ کو نظر میں بھی رکھتا ہے اور محفوظ بھی۔")}
   ]},
  {type:"choice", icon:"drop", skill:"safety", safety:true, prompt:B("Rain starts and the road turns wet and shiny. What changes?","بارش شروع ہو گئی اور سڑک گیلی اور چمکدار ہو گئی۔ کیا بدلے گا؟"),
   options:[
    {t:B("Nothing. Ride the same to finish on time.","کچھ نہیں۔ وقت پر ختم کرنے کے لیے ویسے ہی چلائیں۔"), ok:false, why:B("Wrong pick. A wet road needs much more space to stop, and the first rain lifts oil onto the surface.","غلط انتخاب۔ گیلی سڑک پر رکنے کے لیے کہیں زیادہ جگہ چاہیے، اور پہلی بارش تیل سطح پر لے آتی ہے۔")},
    {t:B("Slow down and keep double distance.","رفتار کم کریں اور دوگنا فاصلہ رکھیں۔"), ok:true, why:B("Right pick. This is the safe standard. Stopping fully to wait is also sensible in very heavy rain, but if you ride, slow with double distance is the rule.","درست انتخاب۔ یہی محفوظ معیار ہے۔ بہت تیز بارش میں رک کر انتظار بھی سمجھداری ہے، لیکن چلنا ہو تو رفتار کم اور دوگنا فاصلہ ہی اصول ہے۔")},
    {t:B("Ride a little faster and finish before the rain gets heavy.","تھوڑا تیز چلائیں اور بارش تیز ہونے سے پہلے ختم کر لیں۔"), ok:false, why:B("Wrong pick. Speed on a wet road is how riders slide. The rain will not wait, but a slower rider still reaches the door.","غلط انتخاب۔ گیلی سڑک پر رفتار ہی رائیڈر کو پھسلاتی ہے۔ بارش نہیں رکے گی، مگر آہستہ چلنے والا رائیڈر پھر بھی دروازے تک پہنچ جاتا ہے۔")}
   ]},
  {type:"choice", icon:"hole", skill:"safety", safety:true, prompt:B("An open manhole is just ahead in your lane. What do you do?","آپ کی لین میں آگے کھلا مین ہول ہے۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Swerve around it at once, without checking behind.","پیچھے دیکھے بغیر فوراً اس کے گرد گھوم جائیں۔"), ok:false, why:B("Wrong pick. The hole is not the only danger. A vehicle behind you may be moving into the same space, and a blind swerve puts you in front of it.","غلط انتخاب۔ خطرہ صرف مین ہول نہیں۔ آپ کے پیچھے والی گاڑی اسی جگہ آ رہی ہو سکتی ہے، اور اندھا موڑ آپ کو اس کے سامنے ڈال دیتا ہے۔")},
    {t:B("Slow down, check behind, and move around it.","رفتار کم کریں، پیچھے دیکھیں، اور بچ کر گزریں۔"), ok:true, why:B("Right pick. The mirror check matters: the danger is often the vehicle behind you, not the hole.","درست انتخاب۔ پیچھے دیکھنا ضروری ہے: خطرہ اکثر مین ہول نہیں، آپ کے پیچھے والی گاڑی ہوتی ہے۔")},
    {t:B("Keep your line and cross it slowly. It is only one hole.","اپنی لائن رکھیں اور آہستہ اس پر سے گزر جائیں۔ ایک ہی تو مین ہول ہے۔"), ok:false, why:B("Wrong pick. An open manhole can swallow a front wheel even at slow speed. There is no safe way through it, only around it.","غلط انتخاب۔ کھلا مین ہول آہستہ رفتار پر بھی اگلا پہیہ نگل سکتا ہے۔ اس میں سے گزرنے کا کوئی محفوظ راستہ نہیں، صرف اس کے گرد سے ہے۔")}
   ]}
 ]},

{id:"m6", area:"a4", icon:"pin",
 name:B("Plan the Route Order","راستے کی ترتیب بنائیں"),
 sub:B("Nearest stops first. Never cross the city twice.","قریب کے اسٹاپ پہلے۔ شہر کو دو بار پار نہ کریں۔"),
 ustad:B("A good route is planned before the wheel moves. These four stops are on one side of the city, from near the hub to far. Tap them in the order you would ride them.","اچھا راستہ پہیہ چلنے سے پہلے بنتا ہے۔ یہ چار اسٹاپ شہر کی ایک طرف ہیں، ہب کے قریب سے دور تک۔ اس ترتیب سے ٹیپ کریں جس سے آپ جائیں گے۔"),
 prove:B("You can order delivery stops so the route flows one way with no backtracking.","آپ ڈیلیوری اسٹاپ اس ترتیب سے رکھ سکتے ہیں کہ راستہ ایک طرف چلے اور واپسی نہ ہو۔"),
 skills:["route"],
 rounds:[
  {type:"seq", icon:"pin", skill:"route", prompt:B("Order the four stops for one smooth run.","ایک آسان چکر کے لیے چار اسٹاپ ترتیب دیں۔"),
   items:[
    {t:B("Stop 1: Main Bazaar, 5 minutes from hub","اسٹاپ 1: مین بازار، ہب سے 5 منٹ"), icon:"pin", why:B("First, the nearest stop. Every route starts close and moves outward.","پہلے، سب سے قریب اسٹاپ۔ ہر راستہ قریب سے شروع ہو کر باہر جاتا ہے۔")},
    {t:B("Stop 2: School Road, same side, 10 minutes on","اسٹاپ 2: اسکول روڈ، اسی طرف، 10 منٹ آگے"), icon:"pin", why:B("Second. It is on the same road going out, so no time is wasted turning back.","دوسرے۔ یہ باہر جانے والی اسی سڑک پر ہے، اس لیے واپس مڑنے کا وقت ضائع نہیں ہوتا۔")},
    {t:B("Stop 3: Garden Town gate, further out","اسٹاپ 3: گارڈن ٹاؤن گیٹ، مزید آگے"), icon:"pin", why:B("Third. Still moving away from the hub in one line.","تیسرے۔ اب بھی ہب سے دور ایک ہی لائن میں جا رہے ہیں۔")},
    {t:B("Stop 4: Old Fort area, the far end","اسٹاپ 4: پرانا قلعہ علاقہ، سب سے آخر"), icon:"pin", why:B("Last, the farthest stop. From here you turn once and ride back toward the hub and your seller pickup.","آخر میں، سب سے دور اسٹاپ۔ یہاں سے ایک بار مڑیں اور ہب اور سیلر پک اپ کی طرف واپس آئیں۔")}
   ]},
  {type:"choice", icon:"clock", skill:"route", prompt:B("Stop 2 customer asked for delivery after 6 pm, but it is 2 pm now. What is the sensible move?","اسٹاپ 2 کے کسٹمر نے شام 6 بجے کے بعد ڈیلیوری کہی تھی، مگر ابھی 2 بجے ہیں۔ سمجھداری والا قدم کیا ہے؟"),
   options:[
    {t:B("Call, confirm the time, and move that stop to the end of the run.","کال کریں، وقت کنفرم کریں، اور وہ اسٹاپ چکر کے آخر میں رکھیں۔"), ok:true, why:B("Right pick. One call saves a wasted door visit, and the stop still gets done on this run.","درست انتخاب۔ ایک کال ضائع دروازہ بچاتی ہے، اور اسٹاپ اسی چکر میں ہو بھی جاتا ہے۔")},
    {t:B("Go now anyway. The customer may be home.","ابھی چلے جائیں۔ ہو سکتا ہے کسٹمر گھر ہو۔"), ok:false, why:B("Wrong pick. The customer already told you the time. Going early usually means a failed attempt and a second trip.","غلط انتخاب۔ کسٹمر وقت بتا چکا ہے۔ جلدی جانے کا مطلب اکثر ناکام کوشش اور دوسرا چکر ہوتا ہے۔")},
    {t:B("Mark the stop attempted now, without going, and save the trip.","بغیر گئے ابھی اس اسٹاپ پر کوشش درج کر دیں اور چکر بچا لیں۔"), ok:false, why:B("Wrong pick. Marking an attempt you never made is a false entry. Reorder the stop to the end of the run and make the real attempt there.","غلط انتخاب۔ جو کوشش آپ نے کی ہی نہیں اسے درج کرنا جھوٹا اندراج ہے۔ اسٹاپ چکر کے آخر میں رکھیں اور وہاں اصل کوشش کریں۔")}
   ]}
 ]},
{id:"m7", area:"a4", icon:"call",
 name:B("Call the Customer","کسٹمر کو کال کریں"),
 sub:B("Respectful words open doors. Use the aap form, always.","عزت والے الفاظ دروازے کھولتے ہیں۔ ہمیشہ آپ والا لہجہ رکھیں۔"),
 ustad:B("Your voice reaches the customer before your bike does. Speak with respect, in the aap form, and say who you are and what you carry. Pick the line a good courier uses.","آپ کی آواز آپ کی بائیک سے پہلے کسٹمر تک پہنچتی ہے۔ عزت سے، آپ والے لہجے میں بات کریں، اور بتائیں آپ کون ہیں اور کیا لائے ہیں۔ وہ جملہ چنیں جو اچھا کوریئر بولتا ہے۔"),
 prove:B("You can open a customer call with respect, confirm the address calmly, and handle a timing request without arguing.","آپ کسٹمر کال عزت سے شروع کر سکتے ہیں، سکون سے پتہ کنفرم کر سکتے ہیں، اور وقت کی درخواست پر بحث کیے بغیر معاملہ سنبھال سکتے ہیں۔"),
 skills:["respect"],
 rounds:[
  {type:"choice", icon:"call", skill:"respect", prompt:B("You reach the street. Pick your opening line on the call.","آپ گلی میں پہنچ گئے۔ کال پر اپنی پہلی بات چنیں۔"),
   options:[
    {t:B("Come down quickly, I have your parcel.","جلدی نیچے آؤ، تمہارا پارسل ہے۔"), ok:false, why:B("Wrong pick. The tum form and an order to hurry sound rude. Customers remember the voice, not just the parcel.","غلط انتخاب۔ تم والا لہجہ اور جلدی کا حکم بدتمیزی لگتا ہے۔ کسٹمر کو پارسل نہیں، آواز یاد رہتی ہے۔")},
    {t:B("Assalam o Alaikum janab, I am the courier rider. Your parcel has arrived. I am at your gate.","السلام علیکم جناب، میں کوریئر رائیڈر بول رہا ہوں۔ آپ کا پارسل آ گیا ہے۔ میں آپ کے گیٹ پر ہوں۔"), ok:true, why:B("Right pick. Greeting, your name and job, and where you are. Respectful aap form from the first word.","درست انتخاب۔ سلام، اپنا تعارف، اور آپ کہاں ہیں۔ پہلے لفظ سے آپ والا عزت بھرا لہجہ۔")},
    {t:B("Where is your house? I cannot find it.","تمہارا گھر کہاں ہے؟ مل نہیں رہا۔"), ok:false, why:B("Wrong pick. No greeting and a blunt tone. Ask with respect and give a landmark instead.","غلط انتخاب۔ نہ سلام، نہ نرمی۔ عزت سے پوچھیں اور کوئی نشانی بتائیں۔")}
   ]},
  {type:"choice", icon:"pin", skill:"respect", prompt:B("The address is unclear. Pick the respectful way to confirm it.","پتہ واضح نہیں۔ اسے کنفرم کرنے کا عزت والا طریقہ چنیں۔"),
   options:[
    {t:B("Janab, I am near the big mosque. Is your house on this street?","جناب، میں بڑی مسجد کے قریب ہوں۔ کیا آپ کا گھر اسی گلی میں ہے؟"), ok:true, why:B("Right pick. A landmark helps the customer guide you, and the tone stays respectful.","درست انتخاب۔ نشانی سے کسٹمر آپ کی رہنمائی کر سکتا ہے، اور لہجہ عزت والا رہتا ہے۔")},
    {t:B("You wrote the address wrong. Tell me again.","آپ نے پتہ غلط لکھا ہے۔ دوبارہ بتائیں۔"), ok:false, why:B("Wrong pick. Blaming the customer starts a fight. The address may be fine; the street may just be hard to find.","غلط انتخاب۔ کسٹمر پر الزام لڑائی شروع کرتا ہے۔ پتہ درست ہو سکتا ہے؛ گلی بس مشکل سے ملتی ہے۔")},
    {t:B("I am leaving. Come to the main road.","میں جا رہا ہوں۔ مین روڈ پر آ جائیں۔"), ok:false, why:B("Wrong pick. Your job is the door, not the main road, unless the customer agrees to meet.","غلط انتخاب۔ آپ کا کام دروازہ ہے، مین روڈ نہیں، جب تک کسٹمر ملنے پر راضی نہ ہو۔")}
   ]},
  {type:"choice", icon:"clock", skill:"respect", prompt:B("The customer says: I am at work, please come after one hour. Pick your reply.","کسٹمر کہتا ہے: میں کام پر ہوں، براہ کرم ایک گھنٹے بعد آئیں۔ اپنا جواب چنیں۔"),
   options:[
    {t:B("No, I cannot come again. Take it now.","نہیں، میں دوبارہ نہیں آ سکتا۔ ابھی لے لیں۔"), ok:false, why:B("Wrong pick. Refusing a reasonable request loses the delivery and earns a complaint.","غلط انتخاب۔ مناسب درخواست سے انکار ڈیلیوری بھی کھوتا ہے اور شکایت بھی لاتا ہے۔")},
    {t:B("Stand at your gate and wait, I am busy too.","اپنے گیٹ پر کھڑے رہیں، میں بھی مصروف ہوں۔"), ok:false, why:B("Wrong pick. Ordering a customer around is never acceptable.","غلط انتخاب۔ کسٹمر کو حکم دینا کبھی قابل قبول نہیں۔")},
    {t:B("No problem, janab. I will come again in one hour. Please keep your phone near you.","کوئی بات نہیں جناب۔ میں ایک گھنٹے بعد دوبارہ آؤں گا۔ براہ کرم فون اپنے پاس رکھیں۔"), ok:true, why:B("Right pick. Agree warmly, fix the plan, and mark the attempt in the app when you get there. You will practice that in Area 5.","درست انتخاب۔ نرمی سے مان لیں، منصوبہ طے کریں، اور وہاں پہنچ کر کوشش ایپ میں درج کریں۔ اس کی مشق آپ حصہ 5 میں کریں گے۔")}
   ]}
 ]},
{id:"m8", area:"a4", icon:"cash",
 name:B("Door Handover and COD","دروازے پر حوالگی اور COD"),
 sub:B("Check the amount on the parcel, take exact cash, give exact change, then mark delivered.","رقم پارسل پر دیکھیں، درست نقدی لیں، درست بقایا دیں، پھر ڈیلیورڈ درج کریں۔"),
 ustad:B("At the door, three things protect you: the COD amount written on the parcel, exact cash, and the app entry made in front of the customer. Do them in that order.","دروازے پر تین چیزیں آپ کی حفاظت کرتی ہیں: پارسل پر لکھی COD رقم، درست نقدی، اور کسٹمر کے سامنے ایپ میں اندراج۔ اسی ترتیب سے کریں۔"),
 prove:B("You can check the COD amount on the parcel, make exact change by tapping notes and coins, and choose the right proof of delivery.","آپ پارسل پر COD رقم دیکھ سکتے ہیں، نوٹ اور سکے ٹیپ کر کے درست بقایا بنا سکتے ہیں، اور درست ڈیلیوری ثبوت چن سکتے ہیں۔"),
 skills:["cash","respect"],
 rounds:[
  {type:"choice", icon:"receipt", skill:"cash", prompt:B("At the door, how do you know the COD amount to collect?","دروازے پر آپ کو کیسے پتہ چلے گا کہ COD کتنی لینی ہے؟"),
   options:[
    {t:B("Ask the customer how much it is.","کسٹمر سے پوچھیں کتنی ہے۔"), ok:false, why:B("Wrong pick. The customer may misremember, or may try a lower amount. The parcel label is the record.","غلط انتخاب۔ کسٹمر کو غلط یاد ہو سکتا ہے، یا وہ کم رقم بتا سکتا ہے۔ پارسل کا لیبل ہی ریکارڈ ہے۔")},
    {t:B("Read the COD amount printed on the parcel and in the app.","پارسل پر چھپی اور ایپ میں دی گئی COD رقم پڑھیں۔"), ok:true, why:B("Right pick. Label and app must agree. If they differ, call the hub before taking cash.","درست انتخاب۔ لیبل اور ایپ ایک ہونے چاہئیں۔ فرق ہو تو نقدی لینے سے پہلے ہب کو کال کریں۔")},
    {t:B("Take whatever cash the customer hands you and sort it out at the hub.","کسٹمر جو نقدی دے وہ لے لیں، حساب ہب پر دیکھ لیں گے۔"), ok:false, why:B("Wrong pick. If the amount is short, the gap is found at the hub count and it comes out of your pocket. The label and the app give the amount before any cash moves.","غلط انتخاب۔ رقم کم ہو تو فرق ہب کی گنتی میں نکلتا ہے اور آپ کی جیب سے جاتا ہے۔ لیبل اور ایپ نقدی ہلنے سے پہلے رقم بتا دیتے ہیں۔")}
   ]},
  {type:"cash", icon:"cash", skill:"cash", target:550, prompt:B("COD is Rs 1,450. The customer gives you a Rs 2,000 note. Tap notes and coins to give the exact change.","COD 1,450 روپے ہے۔ کسٹمر نے 2,000 کا نوٹ دیا۔ نوٹ اور سکے ٹیپ کر کے درست بقایا بنائیں۔"),
   why:B("2,000 minus 1,450 is 550. One 500 note and one 50 note make it exact.","2,000 منفی 1,450 برابر 550۔ ایک 500 کا نوٹ اور ایک 50 کا نوٹ درست بقایا بناتے ہیں۔")},
  {type:"choice", icon:"phone", skill:"app", prompt:B("Cash is in your hand and the parcel is handed over. What is the right proof of delivery?","نقدی آپ کے ہاتھ میں ہے اور پارسل حوالے ہو گیا۔ ڈیلیوری کا درست ثبوت کیا ہے؟"),
   options:[

    {t:B("A handshake with the seller.","سیلر سے ہاتھ ملانا۔"), ok:false, why:B("Wrong pick. A handshake leaves no record. If a count is disputed later, you have nothing.","غلط انتخاب۔ ہاتھ ملانے کا کوئی ریکارڈ نہیں۔ بعد میں گنتی پر جھگڑا ہو تو آپ کے پاس کچھ نہیں۔")},
    {t:B("Confirm the count in the app and take the pickup receipt.","ایپ میں گنتی کنفرم کریں اور پک اپ رسید لیں۔"), ok:true, why:B("Right pick. App confirmation plus the receipt close the pickup. Both sides now agree on the count.","درست انتخاب۔ ایپ کنفرمیشن اور رسید پک اپ بند کرتی ہے۔ اب دونوں طرف گنتی پر اتفاق ہے۔")},
    {t:B("Ride off. The count can be confirmed in the app at the hub.","نکل جائیں۔ گنتی ایپ میں ہب جا کر کنفرم کر لیں گے۔"), ok:false, why:B("Wrong pick. A pickup confirmed late is a count left open. If the seller later claims a higher number, your late entry will not protect you.","غلط انتخاب۔ دیر سے کنفرم پک اپ گنتی کھلی چھوڑتا ہے۔ سیلر بعد میں زیادہ گنتی کا دعویٰ کرے تو آپ کا دیر والا اندراج آپ کو نہیں بچائے گا۔")}
   ]}
 ]},
{id:"m12", area:"a6", icon:"shield",
 name:B("Scam Spotting","دھوکے کی پہچان"),
 sub:B("The office never asks for your secret code. Links and fake offers are traps.","دفتر آپ کا خفیہ کوڈ کبھی نہیں مانگتا۔ لنک اور جعلی آفرز جال ہیں۔"),
 ustad:B("First, a plain definition: the secret code, also called a one time code or OTP, is the number that arrives on your phone to prove it is you. The office never, ever asks for it. Anyone who asks is a thief. Watch for the traps of rider life.","پہلے ایک سادہ تعریف: خفیہ کوڈ، جسے ون ٹائم کوڈ یا OTP بھی کہتے ہیں، وہ نمبر ہے جو آپ کے فون پر آتا ہے تاکہ ثابت ہو کہ یہ آپ ہیں۔ دفتر یہ کبھی، کبھی نہیں مانگتا۔ جو مانگے وہ چور ہے۔ رائیڈر زندگی کے جال دیکھیں۔"),
 prove:B("You can spot the common rider scams: the code trap, the fake payment link, the no entry offer, and the fake note.","آپ رائیڈر کے عام دھوکے پہچان سکتے ہیں: کوڈ والا جال، جعلی ادائیگی لنک، بغیر اندراج والی آفر، اور جعلی نوٹ۔"),
 skills:["scam"],
 rounds:[
  {type:"choice", icon:"phone", skill:"scam", prompt:B("A caller says: I am from the head office. Read me the code that just came on your phone, or your account will close. What do you do?","ایک کال والا کہتا ہے: میں ہیڈ آفس سے ہوں۔ آپ کے فون پر آیا کوڈ پڑھ کر سنائیں، ورنہ آپ کا اکاؤنٹ بند ہو جائے گا۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Read the code. It sounds official.","کوڈ سنا دیں۔ آواز سرکاری لگتی ہے۔"), ok:false, why:B("Wrong pick. The code proves it is you. Whoever holds it can enter your account. The office never asks for it.","غلط انتخاب۔ کوڈ ثابت کرتا ہے کہ یہ آپ ہیں۔ جس کے پاس ہو وہ آپ کے اکاؤنٹ میں گھس سکتا ہے۔ دفتر یہ کبھی نہیں مانگتا۔")},
    {t:B("Cut the call. Then call the hub number yourself and report it.","کال کاٹ دیں۔ پھر خود ہب کے نمبر پر کال کر کے اطلاع دیں۔"), ok:true, why:B("Right pick. Cutting the call ends the trap, and calling the real hub number yourself keeps you safe and warns others.","درست انتخاب۔ کال کاٹنا جال ختم کرتا ہے، اور اصل ہب نمبر پر خود کال کرنا آپ کو بھی بچاتا ہے اور دوسروں کو بھی خبردار کرتا ہے۔")},
    {t:B("Read the code. The caller knew your name and your hub, so he must be from the office.","کوڈ سنا دیں۔ کال والے کو آپ کا نام اور ہب معلوم ہے، تو وہ دفتر ہی سے ہوگا۔"), ok:false, why:B("Wrong pick. Names and hub details leak easily, and scammers use them to sound real. The code is the one thing that proves it is you, and the office never asks for it.","غلط انتخاب۔ نام اور ہب کی تفصیل آسانی سے باہر نکل جاتی ہے، اور دھوکے باز اصلی لگنے کے لیے یہی استعمال کرتے ہیں۔ کوڈ ہی وہ ایک چیز ہے جو ثابت کرتی ہے کہ یہ آپ ہیں، اور دفتر یہ کبھی نہیں مانگتا۔")}
   ]},
  {type:"choice", icon:"phone", skill:"scam", prompt:B("A text message says: Your COD payment is pending. Tap this link and pay now to release your parcels. What do you do?","ایک پیغام آیا: آپ کی COD ادائیگی باقی ہے۔ پارسل چھڑوانے کے لیے اس لنک پر ٹیپ کر کے ابھی ادائیگی کریں۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Tap the link and pay. It mentions COD, so it looks real.","لنک پر ٹیپ کر کے ادائیگی کریں۔ اس میں COD لکھا ہے، اصلی لگتا ہے۔"), ok:false, why:B("Wrong pick. COD is cash at the door and entries in the official app only. A payment link in a text message is a trap to steal money or your account.","غلط انتخاب۔ COD صرف دروازے پر نقدی اور سرکاری ایپ میں اندراج ہے۔ پیغام میں ادائیگی کا لنک پیسے یا اکاؤنٹ چرانے کا جال ہے۔")},
    {t:B("Do not tap. Delete it and tell the hub in-charge.","ٹیپ نہ کریں۔ اسے مٹا دیں اور ہب انچارج کو بتائیں۔"), ok:true, why:B("Right pick. Real company messages never ask you to pay through a random link. Reporting it protects the whole hub.","درست انتخاب۔ اصلی کمپنی پیغامات کبھی کسی لنک سے ادائیگی نہیں مانگتے۔ اطلاع دینا پورے ہب کی حفاظت کرتا ہے۔")},
    {t:B("Forward it to other riders to ask if it is real.","دوسرے رائیڈرز کو بھیج کر پوچھیں کہ یہ اصلی ہے یا نہیں۔"), ok:false, why:B("Wrong pick. Forwarding spreads the trap. Someone will tap it. Ask the in-charge in person instead.","غلط انتخاب۔ آگے بھیجنا جال پھیلاتا ہے۔ کوئی نہ کوئی ٹیپ کرے گا۔ انچارج سے بالمشافہ پوچھیں۔")}
   ]},
  {type:"choice", icon:"cash", skill:"scam", prompt:B("At a door, a man offers you Rs 500 extra to hand over the parcel without any app entry. What do you do?","ایک دروازے پر ایک آدمی آپ کو 500 روپے اضافی دیتا ہے کہ پارسل بغیر ایپ اندراج کے دے دیں۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Take it. Extra money, no harm done.","لے لیں۔ اضافی پیسے ہیں، کوئی نقصان نہیں۔"), ok:false, why:B("Wrong pick. Without an entry the parcel is officially still with you. If it vanishes, you pay for it, and the 500 will not save you.","غلط انتخاب۔ اندراج کے بغیر پارسل سرکاری طور پر اب بھی آپ کے پاس ہے۔ یہ گم ہو تو قیمت آپ دیں گے، اور 500 آپ کو نہیں بچائیں گے۔")},
    {t:B("Refuse with respect: Janab, the entry comes first, then the parcel.","عزت سے انکار کریں: جناب، پہلے اندراج ہوگا، پھر پارسل ملے گا۔"), ok:true, why:B("Right pick. Polite and firm. The entry protects the customer, the company, and you.","درست انتخاب۔ نرم مگر پختہ۔ اندراج کسٹمر، کمپنی، اور آپ، تینوں کی حفاظت ہے۔")},
    {t:B("Hand it over, then make the entry later at the hub.","پارسل دے دیں، اندراج بعد میں ہب پر کر لیں گے۔"), ok:false, why:B("Wrong pick. Later entries get forgotten or disputed. The entry happens at the door, before the parcel changes hands.","غلط انتخاب۔ بعد کے اندراج بھول جاتے ہیں یا متنازع ہوتے ہیں۔ اندراج دروازے پر ہوتا ہے، پارسل ہاتھ بدلنے سے پہلے۔")}
   ]},
  {type:"choice", icon:"cash", skill:"scam", prompt:B("A customer pays COD with a Rs 500 note. The colour looks off and the note feels thin. What do you do?","ایک کسٹمر 500 کے نوٹ سے COD دیتا ہے۔ رنگ عجیب لگتا ہے اور نوٹ پتلا محسوس ہوتا ہے۔ آپ کیا کریں گے؟"),
   options:[
    {t:B("Shout that the note is fake and refuse the parcel.","چلا کر کہیں نوٹ جعلی ہے اور پارسل دینے سے انکار کریں۔"), ok:false, why:B("Wrong pick. Accusing loudly can start a fight, and you may be wrong. Check calmly first.","غلط انتخاب۔ چلا کر الزام لگانا لڑائی شروع کر سکتا ہے، اور آپ غلط بھی ہو سکتے ہیں۔ پہلے سکون سے جانچیں۔")},
    {t:B("Check the note marks calmly, and politely ask for another note if it does not pass.","سکون سے نوٹ کی نشانیاں دیکھیں، اور ٹھیک نہ ہو تو عزت سے دوسرا نوٹ مانگیں۔"), ok:true, why:B("Right pick. Check the print, the colour, and the feel. A real customer will happily swap a doubtful note.","درست انتخاب۔ چھپائی، رنگ، اور پتلا پن دیکھیں۔ اصلی کسٹمر مشکوک نوٹ خوشی سے بدل دے گا۔")},
    {t:B("Accept it quietly. Checking notes is not your job.","خاموشی سے قبول کریں۔ نوٹ دیکھنا آپ کا کام نہیں۔"), ok:false, why:B("Wrong pick. A fake note in your cash bag comes out of your pocket at the hub count.","غلط انتخاب۔ آپ کے نقدی بیگ میں جعلی نوٹ ہب کی گنتی پر آپ کی جیب سے نکلے گا۔")}
   ]}
 ]},
{id:"m13", area:"a6", icon:"cash",
 name:B("Money Sense","پیسے کی سمجھ"),
 sub:B("Real sums, worked out loud. Know what you keep before you spend it.","اصلی حساب، کھل کر کیا گیا۔ خرچ سے پہلے جانیں کہ بچتا کیا ہے۔"),
 ustad:B("Every question here needs a real calculation. Do the sum in your head, step by step. A rider who knows his numbers keeps his money.","یہاں ہر سوال میں اصلی حساب چاہیے۔ ذہن میں قدم بہ قدم حساب کریں۔ جو رائیڈر اپنے اعداد جانتا ہے، وہ اپنا پیسہ بچاتا ہے۔"),
 prove:B("You can work out a day saving from earnings and costs, make exact change, and plan weeks of saving toward a goal.","آپ کمائی اور خرچ سے دن کی بچت نکال سکتے ہیں، درست بقایا بنا سکتے ہیں، اور ہدف کے لیے ہفتوں کی بچت کا منصوبہ بنا سکتے ہیں۔"),
 skills:["money"],
 rounds:[
  {type:"choice", icon:"cash", skill:"money", prompt:B("Today you earned Rs 3,200. Fuel and mobile load cost Rs 1,000. How much do you actually keep?","آج آپ نے 3,200 روپے کمائے۔ پٹرول اور موبائل لوڈ پر 1,000 روپے لگے۔ آپ کے پاس اصل میں کتنا بچا؟"),
   options:[
    {t:B("Rs 1,200","Rs 1,200"), ok:false, why:B("Wrong pick. Do it in steps: 3,200 minus 1,000 is 2,200, not 1,200.","غلط انتخاب۔ قدم بہ قدم کریں: 3,200 منفی 1,000 برابر 2,200، 1,200 نہیں۔")},
    {t:B("Rs 2,200","Rs 2,200"), ok:true, why:B("Right pick. 3,200 minus 1,000 is 2,200. That 2,200 is your real day money, not the 3,200 you first counted.","درست انتخاب۔ 3,200 منفی 1,000 برابر 2,200۔ یہی 2,200 آپ کے دن کے اصلی پیسے ہیں، وہ 3,200 نہیں جو پہلے گنے تھے۔")},
    {t:B("Rs 3,200. Costs do not count.","Rs 3,200۔ خرچ شمار نہیں ہوتا۔"), ok:false, why:B("Wrong pick. Costs are real money out of your hand. A rider who ignores them spends money he does not have.","غلط انتخاب۔ خرچ آپ کے ہاتھ سے گیا اصلی پیسہ ہے۔ جو رائیڈر اسے نظر انداز کرے، وہ وہ پیسہ خرچ کرتا ہے جو اس کے پاس ہے ہی نہیں۔")}
   ]},
  {type:"cash", icon:"cash", skill:"money", target:350, prompt:B("COD is Rs 1,650. The customer gives a Rs 2,000 note. Tap notes and coins to give the exact change.","COD 1,650 روپے ہے۔ کسٹمر نے 2,000 کا نوٹ دیا۔ نوٹ اور سکے ٹیپ کر کے درست بقایا بنائیں۔"),
   why:B("2,000 minus 1,650 is 350. Three 100 notes and one 50 note make it exact.","2,000 منفی 1,650 برابر 350۔ تین 100 کے نوٹ اور ایک 50 کا نوٹ درست بقایا بناتے ہیں۔")},
  {type:"choice", icon:"phone", skill:"money", prompt:B("You want a phone that costs Rs 12,000. You save Rs 2,200 every week. In how many weeks can you buy it without a loan?","آپ کو 12,000 روپے کا فون چاہیے۔ آپ ہر ہفتے 2,200 روپے بچاتے ہیں۔ قرض کے بغیر کتنے ہفتوں میں خرید سکتے ہیں؟"),
   options:[
    {t:B("4 weeks","4 ہفتے"), ok:false, why:B("Wrong pick. 4 weeks of 2,200 is 8,800. That is short of 12,000.","غلط انتخاب۔ 2,200 کے 4 ہفتے 8,800 ہوتے ہیں۔ یہ 12,000 سے کم ہے۔")},
    {t:B("6 weeks","6 ہفتے"), ok:true, why:B("Right pick. 5 weeks makes 11,000, still short. 6 weeks makes 13,200, which covers 12,000 with a little left over.","درست انتخاب۔ 5 ہفتے 11,000 بنتے ہیں، پھر بھی کم۔ 6 ہفتے 13,200 بنتے ہیں، جو 12,000 پورا کر کے کچھ بچا بھی دیتے ہیں۔")},
    {t:B("8 weeks","8 ہفتے"), ok:false, why:B("Wrong pick. 8 weeks works but overshoots. 6 weeks already reaches 13,200, more than the 12,000 price.","غلط انتخاب۔ 8 ہفتے بھی چلتے ہیں مگر زیادہ ہیں۔ 6 ہفتوں میں 13,200 بن جاتے ہیں، جو 12,000 کی قیمت سے زیادہ ہیں۔")}
   ]}
 ]},
/* ---------- AREA 7: BACK AT THE HUB ---------- */
{id:"m14", area:"a7", icon:"receipt",
 name:B("Reconcile the Day","دن کا حساب ملائیں"),
 sub:B("Count the cash, check the notes, match the list, hand it over.","نقدی گنیں، نوٹ دیکھیں، فہرست ملائیں، حوالے کریں۔"),
 ustad:B("The shift is not over when the riding stops. It ends when your cash, your returns, and the delivery list all agree. This is called reconciling. Do it slowly. A quiet count here saves a loud argument later.","شفٹ سواری رکنے پر ختم نہیں ہوتی۔ یہ تب ختم ہوتی ہے جب آپ کی نقدی، آپ کے ریٹرن، اور ڈیلیوری فہرست تینوں مل جائیں۔ اسی کو حساب ملانا کہتے ہیں۔ آہستہ کریں۔ یہاں کی خاموش گنتی بعد کی بلند بحث بچاتی ہے۔"),
 prove:B("You can total a day of COD from the delivery list, spot a fake note in the count, handle a shortfall honestly, and hand over the exact reconciled cash.","آپ ڈیلیوری فہرست سے دن کی COD جمع کر سکتے ہیں، گنتی میں جعلی نوٹ پہچان سکتے ہیں، کمی کو ایمانداری سے سنبھال سکتے ہیں، اور درست ملا ہوا حساب حوالے کر سکتے ہیں۔"),
 skills:["cash"],
 rounds:[
  {type:"choice", icon:"receipt", skill:"cash", prompt:B("Your delivery list shows three COD parcels delivered today: Rs 1,450, Rs 2,300, and Rs 750. What should your cash total be?","آپ کی ڈیلیوری فہرست میں آج تین COD پارسل پہنچائے گئے: 1,450 روپے، 2,300 روپے، اور 750 روپے۔ آپ کی نقدی کل کتنی ہونی چاہیے؟"),
   options:[
    {t:B("Rs 4,400","Rs 4,400"), ok:false, why:B("Wrong pick. Add in steps: 1,450 plus 2,300 is 3,750. 3,750 plus 750 is 4,500.","غلط انتخاب۔ قدم بہ قدم جوڑیں: 1,450 جمع 2,300 برابر 3,750۔ 3,750 جمع 750 برابر 4,500۔")},
    {t:B("Rs 4,500","Rs 4,500"), ok:true, why:B("Right pick. 1,450 plus 2,300 plus 750 is 4,500. Your cash bag must match this number exactly.","درست انتخاب۔ 1,450 جمع 2,300 جمع 750 برابر 4,500۔ آپ کے نقدی بیگ کو اسی عدد سے بالکل ملنا چاہیے۔")},
    {t:B("Rs 5,400","Rs 5,400"), ok:false, why:B("Wrong pick. That adds a digit somewhere. In steps: 1,450 plus 2,300 is 3,750, plus 750 is 4,500.","غلط انتخاب۔ کہیں ایک ہندسہ بڑھ گیا۔ قدم بہ قدم: 1,450 جمع 2,300 برابر 3,750، جمع 750 برابر 4,500۔")}
   ]},
  {type:"spot", icon:"eye", skill:"cash", prompt:B("While counting, check every note. Tap the note that looks fake.","گنتی کے دوران ہر نوٹ دیکھیں۔ جو نوٹ جعلی لگے اس پر ٹیپ کریں۔"),
   cards:[
    {t:"Rs 500", icon:"cash", bad:false, cond:B("Print clear, colour right","چھپائی صاف، رنگ درست")},
    {t:"Rs 500", icon:"cash", bad:false, cond:B("Print clear, colour right","چھپائی صاف، رنگ درست")},
    {t:"Rs 500", icon:"cash", bad:true, cond:B("Colour off, print blurry","رنگ عجیب، چھپائی دھندلی"), why:B("Off colour and blurry print are the classic signs. Keep this note apart and show it to the in-charge. Never pass it on or hide it in the pile.","عجیب رنگ اور دھندلی چھپائی کلاسیکی نشانیاں ہیں۔ اس نوٹ کو الگ رکھیں اور انچارج کو دکھائیں۔ اسے آگے کبھی نہ دیں اور ڈھیر میں نہ چھپائیں۔")},
    {t:"Rs 500", icon:"cash", bad:false, cond:B("Print clear, colour right","چھپائی صاف، رنگ درست")},
    {t:"Rs 500", icon:"cash", bad:false, cond:B("Print clear, colour right","چھپائی صاف، رنگ درست")}]},
